[project]
name = "dd-collector"
version = "0.1.0"
description = "Portable evidence acquisition tool for Electron applications (Windows)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dd-core",
    "psutil>=6.0",
]

[project.scripts]
dd-collect = "dd_collector.cli:main"
dd-collect-gui = "dd_collector.gui:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dd_collector"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

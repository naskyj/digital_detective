[project]
name = "dd-lab"
version = "0.1.0"
description = "Digital Detective investigator application: agent, parsers, ETL, classifier, report"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dd-core",
    "duckdb>=1.1",
    "pydantic-ai-slim[openai]>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# ccl_chromium_reader is git-only (MIT); pinned via [tool.uv.sources] in the root.
chromium = ["ccl-chromium-reader", "ccl-simplesnappy"]
memory = ["volatility3>=2.7"]
# Pure-Python: reads raw/dd/.001-split images, VMDK/VHD(X) VM disks, and E01
# (EWF) containers directly — NTFS/FAT/exFAT — with no mounting and no admin
# rights. Lets the lab extract evidence from an image instead of needing a
# live collection. See dd_lab/imaging/.
image = ["dissect.target>=3.20,<4", "dissect.fat>=3.10,<4"]
# onnxruntime upper-bounded: confirmed on a real x86_64 Mac dev machine -
# `uv sync --extra classify` resolved onnxruntime==1.29.0 (the unbounded
# latest) and failed outright ("doesn't have a source distribution or wheel
# for the current platform") - that release dropped macosx x86_64 wheels
# entirely (only manylinux/macosx arm64/win wheels remain). 1.23.x still
# ships one; pin below it until a newer release restores x86_64 mac support
# or this project drops x86_64 Mac from its supported dev platforms.
# Split from a single `classify` extra that bundled both. The relevance
# model - which drives the veto, the ranking tie-break and the review queue -
# needs onnxruntime ALONE. gliner is the optional NER voter and drags in
# torch, which ships no macosx x86_64 wheel, so bundling them made the
# relevance model uninstallable on an Intel Mac for a dependency it does not
# use. ner_vote falls back to a regex path when gliner is absent, so the
# split costs nothing.
# `tokenizers` is a DIRECT requirement of classify/model.py, not an extra:
# it was previously satisfied only transitively, via gliner -> transformers,
# so splitting gliner out revealed that the relevance model had never
# declared the tokenizer it loads. Without it the ONNX session opens and
# every score silently returns None - the model appears configured and
# does nothing.
classify = ["onnxruntime>=1.19,<1.24", "tokenizers>=0.19"]
ner = ["gliner>=0.2"]
zeroshot = ["transformers>=4.44", "torch>=2.2"]
anthropic = ["pydantic-ai-slim[anthropic]>=1.0"]
google = ["pydantic-ai-slim[google]>=1.0"]
desktop = ["pywebview>=5.0"]

[project.scripts]
dd-lab = "dd_lab.api.main:run"
dd-lab-image = "dd_lab.imaging.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dd_lab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: full-cache / large-evidence tests"]
addopts = "-m 'not slow'"

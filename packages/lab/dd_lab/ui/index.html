<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Detective</title>
<style>
  :root{--bg:#f6f6f7;--panel:#fff;--fg:#1c1c1e;--muted:#6b7280;--line:#e4e4e7;--accent:#7c1d1d;--accent2:#1d4ed8;--ok:#15803d;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg);display:flex;height:100vh;overflow:hidden}
  nav{width:190px;background:#17171a;color:#d4d4d8;padding:18px 0;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
  nav .brand{font-weight:700;font-size:15px;color:#fff;padding:0 20px 16px}
  nav a{padding:9px 20px;cursor:pointer;color:#a1a1aa;text-decoration:none;font-size:13px}
  nav a.active,nav a:hover{background:#27272a;color:#fff}
  nav .foot{margin-top:auto;padding:12px 20px;font-size:11px;color:#71717a}
  main{flex:1;overflow:auto;padding:26px 34px}
  h1{font-size:20px;margin:0 0 18px}h2{font-size:15px;margin:24px 0 10px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
  .card .n{font-size:26px;font-weight:700}.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:var(--accent2);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;transition:filter .1s}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button.primary{padding:10px 20px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  button.sec{background:#e8e8ea;color:#27272a}
  button.ghost{background:transparent;color:var(--accent2);padding:8px 8px}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  /* a real switchable option (Image/Folder), not a button that merely
     looks like a hyperlink (.ghost) sitting next to one that doesn't -
     the selected side uses the app's own accent colour (same as an
     active nav row), the other a plain but still obviously-clickable
     solid button. */
  button.toggle-btn{background:#e8e8ea;color:#27272a}
  button.toggle-btn.active{background:var(--accent2);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px;color:var(--muted);font-size:13px}
  .spin-lg{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite}
  .statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .sd-completed{background:var(--ok)}.sd-running{background:#d97706}.sd-error{background:var(--bad)}.sd-new{background:#9ca3af}
  input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;background:#fff}
  input,select{height:34px}textarea{width:100%;min-height:64px}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f4f4f5;position:sticky;top:0}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#e4e4e7}
  .pill.ok{background:#dcfce7;color:var(--ok)}.pill.bad{background:#fee2e2;color:var(--bad)}
  .pill.cat{background:#eef2ff;color:#3730a3}
  /* one colour per ArtifactCategory (dd_core.enums) - CREDENTIAL/PAYMENT_INFO
     warm+alarming (most sensitive), GENERAL neutral grey (the "nothing
     special" default), the rest spread across cool hues so any two
     adjacent categories in a table read as visibly different at a glance. */
  .pill.cat-CREDENTIAL{background:#fee2e2;color:#991b1b}
  .pill.cat-PAYMENT_INFO{background:#ffedd5;color:#9a3412}
  .pill.cat-LOCATION_INFO{background:#fef3c7;color:#92400e}
  .pill.cat-USER{background:#ede9fe;color:#5b21b6}
  .pill.cat-CHAT_CONTENT{background:#dbeafe;color:#1e40af}
  .pill.cat-GROUP_DETAIL{background:#cffafe;color:#155e75}
  .pill.cat-GAME_DETAIL{background:#d1fae5;color:#065f46}
  .pill.cat-NETWORK_DETAIL{background:#e0f2fe;color:#075985}
  .pill.cat-SYSTEM_DETAIL{background:#e2e8f0;color:#334155}
  .pill.cat-TIMESTAMP{background:#ccfbf1;color:#115e59}
  .pill.cat-GENERAL{background:#e4e4e7;color:#3f3f46}
  /* the artifact table itself: many optional columns can exceed the panel's
     width, so the table is left to its natural (wider-than-container) size -
     the existing .scroll wrapper's overflow:auto already scrolls both axes,
     so this just stops columns from being squeezed/wrapped into tall rows. */
  table.artifacts{width:max-content;min-width:100%}
  table.artifacts td,table.artifacts th{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.artifacts td.wrap{white-space:normal;word-break:break-word}
  table.artifacts tbody tr{cursor:pointer}
  table.artifacts tbody tr:hover{background:#fafafa}
  /* column show/hide picker: a small floating checklist under its toggle button */
  .colpicker{position:relative}
  .colpanel{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.14);
    min-width:170px;max-height:320px;overflow:auto}
  .colpanel label{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 0;cursor:pointer;white-space:nowrap}
  .colpanel input{margin:0}
  /* row-detail modal: click any row for its full, untruncated fields */
  .modal-overlay{position:fixed;inset:0;background:rgba(17,17,20,.4);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:24px}
  .modal-box{background:#fff;border-radius:12px;padding:22px 26px;max-width:760px;width:100%;
    max-height:84vh;overflow:auto;box-shadow:0 16px 50px rgba(0,0,0,.3);position:relative}
  .modal-close{position:absolute;top:14px;right:16px;background:transparent;color:var(--muted);
    border:0;font-size:18px;cursor:pointer;padding:2px 6px}
  .modal-close:hover{color:var(--fg)}
  .modal-field{margin:12px 0}
  .modal-field .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .modal-field .v{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;
    word-break:break-word;margin-top:3px}
  .bar{height:16px;background:var(--accent2);border-radius:3px;min-width:2px}
  .barrow{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
  .log{background:#0b0b0d;color:#c7f5c7;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:7px;max-height:230px;overflow:auto;white-space:pre-wrap}
  .muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
  .scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  /* tbl() cells: unlike .mono, short columns (seq/ts/kind/name/...) must never
     shrink to nothing when a `detail` cell on the same row holds a big JSON
     blob — word-break:break-all lets the browser's table layout treat them as
     infinitely compressible, which wraps them one character per line. */
  .tbl-cell{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}
  .tbl-detail{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;max-width:640px}
  a.link{color:var(--accent2);cursor:pointer}
</style>
</head>
<body>
<nav>
  <div class="brand">🔍 Digital Detective</div>
  <a data-view="dashboard">Dashboard</a>
  <a data-view="import">New Case</a>
  <a data-view="cases">Cases</a>
  <a data-view="settings">Settings</a>
  <div class="foot" id="jobs"></div>
  <div class="foot" id="conn">connecting…</div>
</nav>
<main id="main"><div class="center-loading"><div class="spin-lg"></div><div>Loading…</div></div></main>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(typeof v==='boolean'){if(v)e.setAttribute(x,'');}else e.setAttribute(x,v);}k.flat().forEach(c=>e.append(c?.nodeType?c:document.createTextNode(c??'')));return e;};
// Standard SQL string-literal escaping (double embedded single quotes) for
// the handful of places that build a SQL string client-side to send to the
// read-only /query endpoint (server-side enforces SELECT-only + no writes,
// this is just correctness for app names containing a literal apostrophe).
const sqlQuote = s => "'" + String(s).replace(/'/g,"''") + "'";
const loadingView = (msg)=>el('div',{class:'center-loading'},el('div',{class:'spin-lg'}),el('div',{},msg||'Loading…'));
const api = async (p,opt)=>{const r=await fetch('/api'+p,opt&&{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.headers.get('content-type')?.includes('json')?r.json():r.text();};
const state = {view:'dashboard', arg:null, unsavedWork:null};

function nav(){document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.dataset.view===state.view);a.onclick=()=>go(a.dataset.view);});}
function go(view,arg){
  // Background jobs (extraction, analysis) run on a server-side worker
  // thread and are unaffected by navigating the UI. A handful of short,
  // non-job operations are not (currently: scanning an image) - state.unsavedWork
  // names one of those while it's in flight, so leaving can actually lose it.
  if(state.unsavedWork && !confirm(state.unsavedWork+' is still in progress and will be lost if you leave this page. Leave anyway?')) return;
  state.unsavedWork=null;
  state.view=view;state.arg=arg||null;location.hash=view+(arg?'/'+arg:'');nav();render();
}
window.addEventListener('hashchange',()=>{const[v,a]=location.hash.slice(1).split('/');if(v&&v!==state.view||a!==state.arg){state.view=v||'dashboard';state.arg=a||null;nav();render();}});

// Persistent, app-wide indicator: a background job stays visible (and known
// to genuinely still be running) no matter which page is open.
async function pollActiveJobs(){
  const box=$('#jobs');
  try{
    const d=await api('/jobs');
    box.textContent = d.jobs.length ? `● ${d.jobs.length} job${d.jobs.length>1?'s':''} running` : '';
    box.style.color = d.jobs.length ? '#d97706' : '';
  }catch(e){ /* transient - leave the indicator as it was */ }
}
setInterval(pollActiveJobs, 3000);

const _loadingMsg = {case:'Opening case…', report:'Loading report…', audit:'Loading audit trail…', cases:'Loading cases…', import:'Loading…', settings:'Loading settings…', dashboard:'Loading…', cacheentry:'Opening cache entry…', processdetail:'Opening process…', chat:'Opening chat…'};
async function render(){
  const m=$('#main'); m.innerHTML=''; m.append(loadingView(_loadingMsg[state.view]));
  try{ await ({dashboard:vDashboard,import:vImport,cases:vCases,case:vCase,report:vReport,audit:vAudit,settings:vSettings,cacheentry:vCacheEntry,processdetail:vProcessDetail,chat:vChat}[state.view]||vDashboard)(m); }
  catch(e){ m.innerHTML=''; m.append(el('div',{class:'panel'},'Error: '+e.message)); }
}

async function vDashboard(m){
  const d=await api('/cases');
  m.innerHTML=''; m.append(el('h1',{},'Dashboard'));
  const c=d.counts;
  m.append(el('div',{class:'cards'},
    ...[['Total',c.total],['Running',c.running],['Completed',c.completed],['Stopped',c.stopped]]
      .map(([l,n])=>el('div',{class:'card'},el('div',{class:'n'},String(n)),el('div',{class:'l'},l)))));
  m.append(el('h2',{},'Cases'));
  if(!d.cases.length) m.append(el('div',{class:'panel muted'},
    'No cases yet. Go to Collect to acquire evidence, then Cases to open it.'));
  d.cases.forEach(cs=>{
    const incomplete = cs.status==='error' && (cs.last_message||'').includes('incomplete acquisition');
    m.append(el('div',{class:'panel'},
      el('div',{class:'row'},
        el('span',{class:'statusdot sd-'+cs.status}), el('b',{},cs.name),
        el('span',{class:'muted mono'},cs.case_id),
        el('span',{style:'flex:1'}),
        incomplete
          ? el('span',{class:'pill bad'},'incomplete — re-collect')
          : el('button',{class:'sec',onclick:()=>go('case',cs.case_id)},
              cs.status==='completed'?'Open':'Open')),
      cs.keywords?.length?el('div',{class:'muted',style:'margin-top:6px'},'keywords: '+cs.keywords.join(', ')):'',
      cs.last_message?el('div',{class:'hint'},cs.last_message):''));
  });
}

async function vImport(m){
  // Case creation and evidence import used to be two disconnected flows
  // (Import produced a case_id with no name/keywords; Cases's "New case"
  // then attached those to evidence that already had to exist) - one
  // unified flow now: name the case, add one or more evidence sources
  // (each independently typed Image/Folder and labelled), submit once.
  // More sources can always be added later from the case's own page.
  m.innerHTML=''; m.append(el('h1',{},'New Case'));
  m.append(el('div',{class:'hint',style:'margin-bottom:14px'},
    'This application does not perform live collection on the machine it runs on - '+
    'every evidence source here is either a disk/memory image or a folder of '+
    'evidence someone already extracted, opened read-only.'));
  m.append(newCasePanel());
}

// Small original glyph-style icons (colour + a simple generic shape, not a
// reproduction of any real trademarked logo - this stays fully local/inline,
// no network fetch) for the app-targeting checklist below. Looked up by
// substring against whatever name is being shown (a known target-app key or
// a name discovered by the "Preview apps" scan).
const _APP_ICONS={
  discord:'<svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#5865F2"/><path d="M6 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-6l-3 3v-3H8a2 2 0 0 1-2-2V8z" fill="#fff"/></svg>',
  slack:'<svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#611f69"/><path d="M9 7v10M15 7v10M6 10h12M6 14h12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
  roblox:'<svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#111"/><rect x="7.5" y="7.5" width="9" height="9" fill="none" stroke="#e2231a" stroke-width="1.8"/></svg>',
};
const _APP_ICON_GENERIC='<svg width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#9ca3af"/><rect x="6" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M6 10h12" stroke="#fff" stroke-width="1.6"/></svg>';
function appIcon(name){
  const n=(name||'').toLowerCase();
  const key=Object.keys(_APP_ICONS).find(k=>n.includes(k));
  return el('span',{class:'app-icon',style:'display:inline-flex',html:key?_APP_ICONS[key]:_APP_ICON_GENERIC});
}

// One evidence-source input: type toggle (Image / Folder - they go through
// different acquisition code, dissect vs a flat-folder copy, and warrant
// different hints/browse buttons), path, and a label (best-effort
// suggested from the path, always editable - "mix of both, make it
// intuitive"). Shared by the New Case wizard (one or more rows) and the
// case page's "+ Add evidence source" (a single instance).
function sourceRow(onRemove){
  const box=el('div',{class:'panel',style:'margin-top:10px;background:#fafafa'});
  let kind='image';
  const path=el('input',{placeholder:'/path/to/image.raw, E:\\case.E01, or an OS-root folder',style:'flex:1;min-width:220px'});
  const label=el('input',{placeholder:'e.g. Suspect Laptop, Victim Phone — optional for a single-source case',style:'width:320px'});
  let labelTouched=false;
  label.addEventListener('input',()=>{labelTouched=true;});
  path.addEventListener('change',()=>{
    if(labelTouched || label.value.trim()) return;
    const base=(path.value.trim().split(/[\\/]/).pop()||'')
      .replace(/\.(e01|raw|dd|img|001|vmdk|vhd|vhdx)$/i,'');
    if(base) label.value=base;
  });

  // A real toggle, not two buttons that happen to sit together: the
  // selected one uses the app's own solid accent colour (same as an
  // active nav row), the other stays a plain, still-obviously-clickable
  // secondary button - "ghost" (transparent, link-coloured text) reads as
  // a hyperlink rather than a switchable option, which is why the
  // unselected side wasn't registering as clickable.
  const imgBtn=el('button',{class:'toggle-btn active'},'📀  Image');
  const folderBtn=el('button',{class:'toggle-btn'},'📁  Folder');
  const browseFile=el('button',{class:'sec',onclick:()=>browseForFile(path)},'Browse…');
  const browseFolderBtn=el('button',{class:'sec',style:'display:none',onclick:()=>browseForFolder(path)},'Browse…');
  function setKind(k){
    kind=k;
    imgBtn.className = 'toggle-btn'+(k==='image'?' active':'');
    folderBtn.className = 'toggle-btn'+(k==='folder'?' active':'');
    browseFile.style.display = k==='image'?'inline-block':'none';
    browseFolderBtn.style.display = k==='folder'?'inline-block':'none';
    path.placeholder = k==='image'
      ? '/path/to/image.raw, E:\\case.E01, or an OS-root-shaped folder'
      : 'a folder holding one already-extracted app per subfolder';
  }
  imgBtn.onclick=()=>setKind('image'); folderBtn.onclick=()=>setKind('folder');

  // Apps to include: an upfront Automatic-vs-Target choice (not a buried
  // "(optional)" preview step), with a common-apps checklist people can use
  // without scanning first - the backend's `apps` filter is a plain
  // case-insensitive substring match (acquire.py), so a plain "discord"
  // works regardless of the exact profile-folder name it'll match against.
  let appMode='auto';
  const selectedApps=new Set();
  const autoModeBtn=el('button',{class:'toggle-btn active'},'Automatic (all apps found)');
  const targetModeBtn=el('button',{class:'toggle-btn'},'Target specific apps');
  const targetBox=el('div',{style:'display:none;margin-top:8px'});
  function setAppMode(m){
    appMode=m;
    autoModeBtn.className='toggle-btn'+(m==='auto'?' active':'');
    targetModeBtn.className='toggle-btn'+(m==='target'?' active':'');
    targetBox.style.display=m==='target'?'block':'none';
  }
  autoModeBtn.onclick=()=>setAppMode('auto');
  targetModeBtn.onclick=()=>setAppMode('target');

  function appCheckRow(key,label,extra){
    const cb=el('input',{type:'checkbox',onchange:e=>{
      if(e.target.checked) selectedApps.add(key); else selectedApps.delete(key);
    }});
    return el('label',{style:'display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--fg)'},
      cb, appIcon(key), el('span',{style:'flex:1'},label), extra||'');
  }
  const knownList=el('div');
  [['discord','Discord'],['slack','Slack'],['roblox','Roblox']].forEach(([key,label])=>
    knownList.append(appCheckRow(key,label)));

  const customList=el('div');
  const customInput=el('input',{placeholder:'add another app name…',style:'flex:1'});
  const customAddBtn=el('button',{class:'sec'},'+ Add');
  customAddBtn.onclick=()=>{
    const name=customInput.value.trim();
    if(!name) return;
    selectedApps.add(name.toLowerCase());
    customList.append(appCheckRow(name.toLowerCase(),name));
    customInput.value='';
  };

  const scanBtn=el('button',{class:'ghost'},'Scan this source for apps (optional)');
  const scanLog=el('div',{class:'hint'});
  const scanResultsBox=el('div',{style:'display:none;margin-top:8px'});
  scanBtn.onclick=async()=>{
    if(!path.value.trim()) return alert('Enter a path first.');
    scanBtn.disabled=true; scanBtn.textContent='Scanning…';
    scanLog.textContent=''; scanResultsBox.style.display='none'; scanResultsBox.innerHTML='';
    try{
      const d=await api('/image/list',{method:'POST',body:JSON.stringify({image_path:path.value.trim()})});
      if(!d.apps.length) scanLog.textContent='No supported application profiles were found.';
      else{
        setAppMode('target');
        scanResultsBox.style.display='block';
        d.apps.forEach(a=>{
          const nameKey=a.name.toLowerCase();
          selectedApps.add(nameKey);
          scanResultsBox.append(el('label',{style:'display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--fg)'},
            el('input',{type:'checkbox',checked:'',onchange:e=>{
              if(e.target.checked) selectedApps.add(nameKey); else selectedApps.delete(nameKey);
            }}),
            appIcon(a.name), el('span',{style:'flex:1'},a.name, a.version?' v'+a.version:''),
            el('span',{class:'muted mono',style:'font-size:10px'},a.profile_dir)));
        });
      }
    }catch(e){ scanLog.textContent='Could not open: '+e.message; }
    scanBtn.disabled=false; scanBtn.textContent='Scan this source for apps (optional)';
  };

  targetBox.append(
    knownList, customList,
    el('div',{class:'row',style:'margin-top:6px'}, customInput, customAddBtn),
    el('div',{class:'hint',style:'margin-top:10px'},'Or scan this source to see exactly what\'s on it:'),
    el('div',{class:'row'}, scanBtn), scanLog, scanResultsBox,
  );

  const memImg=el('input',{placeholder:'optional — a full-RAM capture acquired separately',style:'flex:1;min-width:220px'});
  const browseMemImg=el('button',{class:'sec',onclick:()=>browseForFile(
    memImg,['Memory dumps (*.raw;*.dmp;*.mem;*.bin)','All files (*.*)'])},'Browse…');

  const statusLog=el('div',{class:'log',style:'display:none;margin-top:8px'});
  const rowHeader=el('div',{class:'row'}, imgBtn, folderBtn, el('span',{style:'flex:1'}));
  if(onRemove){
    const removeBtn=el('button',{class:'ghost',style:'color:var(--bad)',onclick:()=>{box.remove();onRemove();}},'✕ Remove');
    rowHeader.append(removeBtn);
  }
  box.append(rowHeader,
    el('label',{},'Path'), el('div',{class:'row'}, path, browseFile, browseFolderBtn),
    el('label',{},'Label (who/what this source is from)'), label,
    el('label',{},'Apps to include'), el('div',{class:'row'}, autoModeBtn, targetModeBtn), targetBox,
    el('label',{},'Memory image (optional)'), el('div',{class:'row'}, memImg, browseMemImg),
    statusLog);
  setKind('image');

  return {
    el: box, statusLog,
    value(){
      const apps = appMode==='auto' ? null : (selectedApps.size ? [...selectedApps] : null);
      return {path: path.value.trim(), label: label.value.trim(), apps,
        memoryImagePath: memImg.value.trim()||null};
    },
  };
}

    rows.push(r); sourcesWrap.append(r.el);

    if(!name.value.trim()) return alert('Case name is required.');

    createBtn.disabled=true; createBtn.innerHTML='<span class="spin"></span>Creating case…';
    bgHint.style.display='none';
    let caseId;
    try{
      const meta=await api('/cases',{method:'POST',body:JSON.stringify({
        case_id:cid.value.trim()||null, name:name.value.trim(), description:desc.value, keywords:kw.value})});
      caseId=meta.case_id;
    }catch(e){
      alert('Could not create the case: '+e.message);
      createBtn.disabled=false; createBtn.textContent='Create case'; return;
    }
    bgHint.style.display='block';
    for(let i=0;i<sourceValues.length;i++){
      const sv=sourceValues[i];
      createBtn.innerHTML=`<span class="spin"></span>Adding source ${i+1}/${sourceValues.length}…`;
      sv.row.statusLog.style.display='block'; sv.row.statusLog.textContent='Starting…';
      try{
        const r=await api(`/cases/${encodeURIComponent(caseId)}/sources`,{method:'POST',body:JSON.stringify({
          source_path:sv.path, source_label:sv.label, apps:sv.apps,
          memory_image_path:sv.memoryImagePath, operator:op.value})});
        await pollJob(r.job_id, sv.row.statusLog);
      }catch(e){ sv.row.statusLog.textContent='Could not start: '+e.message; }
    }
    go('case', caseId);
  }},'Create case');
  box.append(createBtn, bgHint);
  return box;
}

  const formWrap=el('div',{style:'display:none;margin-top:10px'});

      formWrap.style.display='block'; formWrap.innerHTML='';

        row.statusLog.style.display='block'; row.statusLog.textContent='Starting…';

async function browseForFile(inputEl,fileTypes){
  // Native picker (pywebview desktop window only) returns the real local
  // path with no file transfer at all — the right choice for a forensic
  // image/memory dump that can be tens of GB, unlike an actual browser
  // upload which would mean copying the whole thing over HTTP first.
  if(!(window.pywebview && window.pywebview.api && window.pywebview.api.pick_file)){
    alert('Native file browsing needs the desktop app window (not a plain browser tab) — type the path instead.');
    return;
  }
  try{
    const p=await window.pywebview.api.pick_file(fileTypes||null);
    if(p) inputEl.value=p;
  }catch(e){ alert('Could not open the file picker: '+e.message); }
}

async function browseForFolder(inputEl){
  // For the image-import path's other two accepted shapes - an OS-root-
  // shaped folder, or a plain folder of already-extracted app subfolders -
  // where a file picker doesn't apply.
  if(!(window.pywebview && window.pywebview.api && window.pywebview.api.pick_folder)){
    alert('Native folder browsing needs the desktop app window (not a plain browser tab) — type the path instead.');
    return;
  }
  try{
    const p=await window.pywebview.api.pick_folder();
    if(p) inputEl.value=p;
  }catch(e){ alert('Could not open the folder picker: '+e.message); }
}

async function pollJob(id,logEl,onDone){
  while(true){
    let j; try{ j=await api('/jobs/'+id); }catch(e){ logEl.textContent+='\n(lost contact with the job)'; return; }
    logEl.textContent=j.log.map(l=>l.msg).join('\n');
    if(j.status==='error') logEl.textContent+='\n\n✗ FAILED: '+((j.error||'').split('\n')[0]);
    if(j.status==='done')  logEl.textContent+='\n\n✓ done';
    logEl.scrollTop=logEl.scrollHeight;
    if(j.status==='done'||j.status==='error'){
      if(onDone) setTimeout(()=>onDone(j), 900);   // let the user see the final line
      return j;
    }
    await new Promise(r=>setTimeout(r,700));
  }
}

function ago(iso){
  if(!iso) return '';
  const s=Math.max(0,(Date.now()-new Date(iso))/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' d ago';
}

async function vCase(m){
  const id=state.arg;
  let d;
  try{ d=await api('/cases/'+encodeURIComponent(id)); }
  catch(e){
    m.innerHTML='';
    m.append(el('h1',{},id));
    m.append(el('div',{class:'panel'},
      el('b',{},'This case can’t be opened.'),
      el('div',{class:'hint'},e.message.includes('not found')
        ? 'There is no signed manifest.json in this folder — the acquisition did not finish. Re-run the collector for this case (close the target apps first so their databases aren’t locked).'
        : e.message),
      el('div',{class:'row',style:'margin-top:10px'},
        el('button',{class:'sec',onclick:()=>go('import')},'Go to New Case'),
        el('button',{class:'ghost',onclick:()=>go('cases')},'Back to Cases'))));
    return;
  }

  const iv=d.integrity, w=d.warehouse;
  const job=d.active_job;
  const running = job && (job.status==='queued'||job.status==='running');
  const processed = !!w;
  const hasEvidence = d.evidence.apps.length > 0;

  m.innerHTML='';
  m.append(el('div',{class:'row'},
    el('h1',{style:'margin:0'},d.meta.name),
    el('span',{class:'muted mono'},id)));

  // --- evidence sources - the human-facing registry (label/kind/when
  // added), separate from the signed manifest's own record of what's
  // actually there. Shown whenever there's at least one, whether or not
  // the case has been through "Run analysis" yet. -------------------------
  if(d.meta.sources && d.meta.sources.length){
    m.append(el('div',{class:'panel'},
      el('b',{},'Evidence sources'),
      ...d.meta.sources.map(s=>el('div',{class:'hint',style:'margin-top:4px'},
        `${s.label || '(no label)'} — ${s.kind} — ${s.apps.length} app(s) — `+
        `added ${ago(s.added_ts)}${s.operator?' by '+s.operator:''}`))));
  }

  // --- evidence + integrity -------------------------------------------------
  if(hasEvidence){
    const integ = el('div',{class:'row',style:'margin-top:10px'});
    if(iv.ok){
      integ.append(el('span',{class:'pill ok'},'✓ integrity verified'),
        el('span',{class:'muted'},'checked '+ago(iv.verified_ts)),
        el('button',{class:'ghost',onclick:async(e)=>{
          e.target.textContent='checking…'; e.target.disabled=true;
          try{ await api('/cases/'+id+'/verify',{method:'POST'}); go('case',id); }
          catch(x){ alert(x.message); e.target.disabled=false; e.target.textContent='re-check'; }
        }},'re-check'));
    } else {
      integ.append(el('span',{class:'pill bad'},'⚠ INTEGRITY FAILED'),
        el('span',{class:'muted'},`${iv.issues.length} issue(s) — signature valid: ${iv.signature_valid}`));
    }
    m.append(el('div',{class:'panel'},
      integ,
      el('div',{class:'hint'},
        `${iv.files} files · ${d.evidence.apps.join(', ')} · `+
        `${(d.evidence.bytes/1e6).toFixed(1)} MB · acquired on ${d.evidence.host}`),
      d.meta.keywords.length?el('div',{class:'hint'},'keywords: '+d.meta.keywords.join(', ')):'',
      !iv.ok?el('div',{class:'scroll',style:'margin-top:8px'},
        tbl(iv.issues,['kind','path','expected','actual'])):''));

    // These three read straight off the evidence directory, so they work
    // whether or not "Run analysis" has happened yet. Once the case is
    // processed they move into the explorer's left nav below (so they
    // aren't duplicated); until then they're shown here on their own.
    if(!processed){
      const preAppSel=el('select',{}, ...d.evidence.apps.map(a=>el('option',{value:a},a)));
      const preFilesWrap=el('div',{});
      function renderPreFiles(){
        preFilesWrap.innerHTML='';
        preFilesWrap.append(cacheFilesPanel(id, preAppSel.value),
          localStorageFilesPanel(id, preAppSel.value), databaseFilesPanel(id, preAppSel.value));
      }
      preAppSel.onchange=renderPreFiles;
      m.append(el('div',{class:'panel',style:'margin-bottom:0'},
        el('label',{},'App'), preAppSel));
      m.append(preFilesWrap);
      renderPreFiles();
    }
  } else {
    m.append(el('div',{class:'panel'},
      el('b',{},'No evidence yet'),
      el('div',{class:'hint'},'Add an evidence source below to get started - a disk/memory image, '+
        'or a folder of evidence someone already extracted.'),
      d.meta.keywords.length?el('div',{class:'hint',style:'margin-top:6px'},'keywords: '+d.meta.keywords.join(', ')):''));
  }

  // --- add another evidence source, any time - not just at creation ------
  m.append(addSourcePanel(id, ()=>go('case', id)));

  if(!hasEvidence) return;  // nothing to run/explore yet

  // --- the primary action panel ------------------------------------------
  const actions=el('div',{class:'panel'});
  const runlog=el('div',{id:'runlog',class:'log',style:'display:none;margin-top:10px'});

  async function startRun(btn){
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>starting…';
    runlog.style.display='block'; runlog.textContent='';
    try{
      const r=await api('/cases/'+id+'/run',{method:'POST'});
      await pollJob(r.job_id,runlog,()=>go('case',id));
    }catch(err){
      runlog.textContent='Could not start: '+err.message;
      btn.disabled=false; btn.textContent='Run analysis';
    }
  }

  async function startReclassify(btn){
    // Cheap, in-place re-classify (classify_warehouse) - no re-parse of raw
    // evidence, unlike Run analysis above. For when relevance_model_dir/
    // classifier_model_dir just changed, or the ensemble's own logic did,
    // and existing artifacts need to reflect that.
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>starting…';
    runlog.style.display='block'; runlog.textContent='';
    try{
      const r=await api('/cases/'+id+'/reclassify',{method:'POST'});
      await pollJob(r.job_id,runlog,()=>go('case',id));
    }catch(err){
      runlog.textContent='Could not start: '+err.message;
      btn.disabled=false; btn.textContent='↻  Re-classify';
    }
  }

  async function startRegenerateReport(btn){
    // Rebuilds the report from whatever's currently in the warehouse and
    // logs/findings.json - no re-parse/re-classify/re-investigate. Use
    // after saving a finding from chat (Save as finding), or after
    // Re-classify, to get those changes into an actual report file.
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>starting…';
    runlog.style.display='block'; runlog.textContent='';
    try{
      const r=await api('/cases/'+id+'/regenerate-report',{method:'POST'});
      await pollJob(r.job_id,runlog,()=>go('case',id));
    }catch(err){
      runlog.textContent='Could not start: '+err.message;
      btn.disabled=false; btn.textContent='🔄  Regenerate report';
    }
  }

  if(running){
    actions.append(
      el('div',{class:'row'},
        el('span',{class:'spin',style:'border-color:#0003;border-top-color:#333'}),
        el('b',{},'Analysis running…'),
        el('span',{class:'muted'},'this can take a minute for a large cache')),
      runlog);
    pollJob(job.id,runlog,()=>go('case',id));
  } else if(!processed){
    const b=el('button',{class:'primary',onclick:e=>startRun(e.target)},'▶  Run analysis');
    actions.append(b,
      el('div',{class:'hint'},'Verifies every file against the signed manifest, then parses, '+
        'classifies, analyses any memory dumps, and builds the report.'),
      job&&job.status==='error'?el('div',{class:'hint',style:'color:var(--bad)'},
        'Previous run failed — '+(job.error||'').split('\n')[0]):'',
      runlog);
  } else {
    actions.append(el('div',{class:'row'},
      d.reports.length?el('button',{class:'primary',onclick:()=>go('report',id)},'📄  Open report'):'',
      el('button',{class:'sec',onclick:()=>go('chat',id)},'💬  Chat'),
      el('button',{class:'sec',onclick:e=>startRun(e.target)},'↻  Re-run analysis'),
      el('button',{class:'sec',title:'Re-classify artifacts already in the warehouse, in place - no re-parse '+
        '(cheaper than Re-run analysis; use after changing the relevance/category model directory)',
        onclick:e=>startReclassify(e.target)},'↻  Re-classify'),
      el('button',{class:'sec',title:'Rebuild the report from what\'s currently in the warehouse and '+
        'findings - no re-parse/re-classify (use after Save as finding, or after Re-classify)',
        onclick:e=>startRegenerateReport(e.target)},'🔄  Regenerate report'),
      el('button',{class:'sec',onclick:()=>document.getElementById('browser')
        ?.scrollIntoView({behavior:'smooth'})},'🔍  Browse artifacts'),
      el('button',{class:'ghost',onclick:()=>go('audit',id)},'📋  Audit trail')),
      el('div',{class:'hint'},
        `${w.artifacts.toLocaleString()} artifacts · ${w.high_priority} high-priority · `+
        (job&&job.updated_ts?'analysed '+ago(job.updated_ts):'')),
      runlog);
  }
  m.append(actions);

  // --- results: a left-nav explorer (app -> source type, each with a
  // count - the same drill-down shape a tool like Magnet AXIOM uses) driving
  // a right-hand content pane. ---------------------------------------------
  if(processed){
    const explorer=await caseExplorer(id, w);
    explorer.id='browser'; m.append(explorer);
  }
}

const SRC_LABELS = {
  local_storage:'Local Storage', session_storage:'Session Storage', indexeddb:'IndexedDB',
  cache:'Cache', cookies:'Cookies', preferences:'Preferences', local_state:'Local State',
  memory_string:'Memory Strings', memory_process:'Memory Processes',
  memory_network:'Memory Network', memory_artifact:'Memory Artifacts',
  // native (non-Chromium) config/log/JSON files no named parser claims - a
  // WebView2/MSIX-hosted app's own native root (Roblox's logs/XML/JSON, not
  // the embedded browser profile), or a stray file loose in a normal
  // Electron app's profile (e.g. Discord's own settings.json) - see
  // dd_lab/parsers/appdata.py.
  app_data:'App Data',
};

// Which source_types have a raw physical-FILES view (as opposed to only the
// parsed-content Artifacts view), and which explorerSelection.type each one
// answers to - the files-vs-content distinction ChromeCacheView-style
// tooling normally gives you. Not every source_type has one (IndexedDB,
// Session Storage, Preferences, ... don't yet) - those stay a single leaf
// that goes straight to Artifacts, same as before.
//
// memory_process is a different shape from the other three: cache/local_storage/
// cookies read straight off physical evidence files still sitting on disk, but a
// process's own memory was extracted, carved, and deleted during analysis (see
// dd_lab/memory/analyze.py) - there's no file left to re-open. Its "Files" view
// (processesPanel) instead pivots the warehouse's own memory_process rows (one
// flat key=value row per Volatility pslist/cmdline column today) into one row
// per process, and clicking a process opens a dedicated detail page rather than
// an iframe over a re-read file.
const FILES_PANEL_TYPE = {cache:'cachefiles', local_storage:'lsfiles', cookies:'dbfiles', memory_process:'processes'};
const FILES_PANEL_FN = {cachefiles:cacheFilesPanel, lsfiles:localStorageFilesPanel, dbfiles:databaseFilesPanel, processes:processesPanel};

async function caseExplorer(id, w){
  const nav=el('div',{class:'panel',style:'width:240px;flex-shrink:0;align-self:flex-start;position:sticky;top:0;max-height:calc(100vh - 140px);overflow:auto'});
  const content=el('div',{style:'flex:1;min-width:0'});
  const wrap=el('div',{style:'display:flex;gap:16px;align-items:flex-start'}, nav, content);

  let tree;
  try{ tree=await api('/cases/'+id+'/artifact-tree'); }
  catch(e){ tree={apps:[]}; }
  const sel = state.explorerSelection && state.explorerSelection.caseId===id
    ? state.explorerSelection : {type:'overview'};
  state.explorerSelection = {...sel, caseId:id};

  function navRow(label,count,active,onclick,indent,icon){
    return el('div',{onclick,
      style:`cursor:pointer;padding:6px ${8+indent*14}px;border-radius:6px;font-size:12.5px;`+
        `display:flex;align-items:center;gap:6px;margin:1px 0;`+
        (active?`background:var(--accent2);color:#fff`:`color:var(--fg)`)},
      icon?el('span',{class:'nav-chevron',style:'width:12px;flex-shrink:0;text-align:center;opacity:.7'},icon):'',
      el('span',{style:'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},label),
      count!=null?el('span',{style:(active?'':'color:var(--muted)')+';flex-shrink:0'},count.toLocaleString()):'');
  }
  const expandedApps = new Set();  // collapsed by default; persists across renderNav() calls
  const expandedSources = new Set();  // "app/source_type" keys, same idea one level down
  const expandedLabels = new Set();  // evidence-source labels, same idea one level UP (multi-source cases)
  // Every level also auto-opens while the current selection sits BELOW it,
  // so the selected node is never hidden inside a collapsed parent. That
  // auto-open used to be unconditional, which made the chevron look dead:
  // clicking it removed the node from expandedX, then isOpen recomputed to
  // true anyway from the "something active below" half. Reported from real
  // use - collapsing the app you were browsing did nothing, while the app
  // next to it (nothing selected inside) collapsed fine.
  //
  // So an explicit collapse is recorded, and it beats the auto-open. It is
  // cleared again by select(), so clicking back into a node still opens its
  // parents.
  const collapsedApps = new Set();
  const collapsedSources = new Set();
  const collapsedLabels = new Set();
  function isOpenWith(key, expanded, collapsed, activeBelow){
    return collapsed.has(key) ? false : (expanded.has(key) || activeBelow);
  }
  function toggleSet(key, expanded, collapsed, isOpen){
    if(isOpen){ expanded.delete(key); collapsed.add(key); }
    else { collapsed.delete(key); expanded.add(key); }
    renderNav();
  }
  function toggleExpand(app, isOpen){ toggleSet(app, expandedApps, collapsedApps, isOpen); }
  function toggleSourceExpand(k, isOpen){ toggleSet(k, expandedSources, collapsedSources, isOpen); }
  function toggleLabelExpand(l, isOpen){ toggleSet(l, expandedLabels, collapsedLabels, isOpen); }

  async function select(next){
    state.explorerSelection={...next, caseId:id};
    // Navigating INTO a node clears any explicit collapse on its parents -
    // otherwise a node you had collapsed would stay shut when you clicked
    // back into it, and the auto-open could never take effect again.
    if(next.app){
      collapsedApps.delete(next.app);
      if(next.source_type) collapsedSources.delete(next.app+'/'+next.source_type);
      collapsedLabels.clear();
    }
    renderNav();
    content.innerHTML=''; content.append(await paneFor(next));
  }
  async function paneFor(s){
    if(FILES_PANEL_FN[s.type]) return FILES_PANEL_FN[s.type](id, s.app);
    if(s.type==='correlations') return correlationsPanel(id);
    if(s.type==='timeline') return timelinePanel(id);
    if(s.type==='source') return browser(id, w.by_category.map(c=>c.category).filter(Boolean),
      {app:s.app, source_type:s.source_type});
    return overviewPanel(id, w);
  }

  // One app's rendering (itself + its source_types + their Files/Artifacts
  // children) - shared by the flat (no source label) case and the grouped
  // (multi-source case, indented one level under its label) case, so the
  // two don't drift into two different nav behaviours.
  function renderAppRow(a, baseIndent){
    const s=state.explorerSelection;
    const appActiveBelow = (s.type==='source' || FILES_PANEL_FN[s.type]) && s.app===a.app;
    const isOpen = isOpenWith(a.app, expandedApps, collapsedApps, appActiveBelow);
    const row = navRow(a.app, a.total, s.type==='source'&&s.app===a.app&&!s.source_type,
      ()=>select({type:'source', app:a.app, source_type:null}), baseIndent, isOpen?'▾':'▸');
    row.querySelector('.nav-chevron').onclick = (e)=>{ e.stopPropagation(); toggleExpand(a.app, isOpen); };
    nav.append(row);
    if(!isOpen) return;
    a.sources.forEach(src=>{
      const filesType = FILES_PANEL_TYPE[src.source_type];
      const artifactsActive = s.type==='source' && s.app===a.app && s.source_type===src.source_type;
      if(!filesType){
        nav.append(navRow(SRC_LABELS[src.source_type]||src.source_type, src.n, artifactsActive,
          ()=>select({type:'source', app:a.app, source_type:src.source_type}), baseIndent+1));
        return;
      }
      // A source_type with a raw-files view: two children, Files (physical
      // files - every content type, not just what got parsed) and
      // Artifacts (the parsed content, same as every other source_type).
      const filesActive = s.type===filesType && s.app===a.app;
      const srcKey=a.app+'/'+src.source_type;
      const srcOpen = isOpenWith(srcKey, expandedSources, collapsedSources, filesActive||artifactsActive);
      const srcRow = navRow(SRC_LABELS[src.source_type]||src.source_type, src.n, false,
        ()=>toggleSourceExpand(srcKey, srcOpen), baseIndent+1, srcOpen?'▾':'▸');
      srcRow.querySelector('.nav-chevron').onclick=(e)=>{e.stopPropagation(); toggleSourceExpand(srcKey, srcOpen);};
      nav.append(srcRow);
      if(!srcOpen) return;
      nav.append(navRow('Files', null, filesActive, ()=>select({type:filesType, app:a.app}), baseIndent+2));
      nav.append(navRow('Artifacts', null, artifactsActive,
        ()=>select({type:'source', app:a.app, source_type:src.source_type}), baseIndent+2));
    });
  }

  function renderNav(){
    nav.innerHTML='';
    const s=state.explorerSelection;
    nav.append(el('div',{style:'font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px'},'Explore'));
    nav.append(navRow('Overview', null, s.type==='overview', ()=>select({type:'overview'}), 0));
    // case-wide investigation views, not tied to one app - siblings of
    // Overview rather than nested under any app (Phase 5 of the
    // agent-improvement plan: these were previously only reachable, once,
    // baked into the static report's §5/§7 sections).
    nav.append(navRow('Correlations', null, s.type==='correlations', ()=>select({type:'correlations'}), 0));
    nav.append(navRow('Timeline', null, s.type==='timeline', ()=>select({type:'timeline'}), 0));
    nav.append(el('div',{style:'height:1px;background:var(--line);margin:10px 0'}));

    // Apps with no evidence-source label (every case before this feature,
    // and any source whose label was left blank) render flat, exactly as
    // before. Labelled apps group under their source's label one level up
    // - a multi-source case (a suspect's laptop AND a victim's phone, say)
    // reads as "Suspect Laptop -> discord -> ..." / "Victim Phone ->
    // discord -> ...", not one flat list where two people's same-named
    // apps sit side by side with nothing distinguishing them.
    const unlabelled = tree.apps.filter(a=>!a.source_label);
    const labelled = new Map();  // label -> [apps]
    tree.apps.forEach(a=>{
      if(!a.source_label) return;
      if(!labelled.has(a.source_label)) labelled.set(a.source_label, []);
      labelled.get(a.source_label).push(a);
    });

    unlabelled.forEach(a=>renderAppRow(a, 0));

    labelled.forEach((apps, label)=>{
      const total = apps.reduce((n,a)=>n+a.total, 0);
      const anyActiveBelow = apps.some(a=>
        (s.type==='source' || FILES_PANEL_FN[s.type]) && s.app===a.app);
      const isOpen = isOpenWith(label, expandedLabels, collapsedLabels, anyActiveBelow);
      const row = navRow(label, total, false, ()=>toggleLabelExpand(label, isOpen), 0, isOpen?'▾':'▸');
      row.querySelector('.nav-chevron').onclick=(e)=>{e.stopPropagation(); toggleLabelExpand(label, isOpen);};
      nav.append(row);
      if(isOpen) apps.forEach(a=>renderAppRow(a, 1));
    });

    if(!tree.apps.length) nav.append(el('div',{class:'hint'},'No artifact breakdown available.'));
  }

  renderNav();
  content.append(await paneFor(state.explorerSelection));
  return wrap;
}

async function overviewPanel(id, w){
  const box=el('div',{});
  // Relevance first - the primary output this pipeline produces now,
  // ahead of the category breakdown below (still useful for display/
  // grouping, just no longer what "matters to the investigation" means).
  box.append(await relevancePanel(id));
  const max=Math.max(...w.by_category.map(c=>c.artifacts),1);
  const bars=el('div',{class:'panel'});
  bars.append(el('h2',{style:'margin-top:0'},'Artifact categories'));
  w.by_category.filter(c=>c.category).forEach(c=>bars.append(el('div',{class:'barrow'},
    el('span',{class:'pill cat'},c.category),
    el('div',{class:'bar',style:`width:${100*c.artifacts/max}%`}),
    el('span',{class:'muted'},c.artifacts.toLocaleString()))));
  box.append(bars);
  box.append(await classificationPanel(id));
  return box;
}

async function classificationPanel(id){
  // Answers "what was classified as forensic vs. general, and how robustly":
  // the ensemble already votes per artifact (regex/keyword/NER/model) but
  // nothing surfaced that before — a category only one voter ever fires on
  // is a much weaker signal than one several voters agree on.
  const wrap=el('div',{class:'panel'});
  wrap.append(el('h2',{style:'margin-top:0'},'Classification breakdown'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'How the rules + keyword + NER + model + entropy ensemble voted per category. '+
      'Click a row for a few example artifacts and their individual votes.'));
  let d;
  try{ d=await api('/cases/'+id+'/classification'); }
  catch(e){ wrap.append(el('div',{class:'hint'},'Could not load: '+e.message)); return wrap; }

  const t=el('table',{},el('thead',{},el('tr',{},
    ...['Category','Count','Mean conf','Regex','Keyword','NER','Model','Entropy'].map(h=>el('th',{},h)))));
  const tb=el('tbody',{});
  d.by_category.forEach(c=>{
    const exBox=el('div',{style:'display:none;padding:8px 0'});
    const row=el('tr',{style:'cursor:pointer',onclick:()=>{
      if(exBox.style.display==='none'){
        if(!exBox.childNodes.length){
          const examples=d.examples[c.category]||[];
          exBox.append(examples.length
            ? tbl(examples,['app','source_type','key','value','regex_vote','keyword_vote','ner_vote','model_vote','entropy_vote'])
            : el('div',{class:'hint'},'no examples'));
        }
        exBox.style.display='block';
      } else exBox.style.display='none';
    }},
      el('td',{},el('span',{class:'pill cat'},c.category||'')),
      el('td',{},c.n.toLocaleString()),
      el('td',{},c.mean_conf??''),
      el('td',{},c.regex_agree.toLocaleString()),
      el('td',{},c.keyword_agree.toLocaleString()),
      el('td',{},c.ner_agree.toLocaleString()),
      el('td',{},c.model_agree.toLocaleString()),
      el('td',{},c.entropy_agree.toLocaleString()));
    tb.append(row);
    const exRow=el('tr',{}); const exCell=el('td',{colspan:'8'},exBox);
    exRow.append(exCell); tb.append(exRow);
  });
  t.append(tb);
  wrap.append(el('div',{class:'scroll'},t));
  return wrap;
}

async function relevancePanel(id){
  // The primary output's own breakdown, mirroring classificationPanel's
  // shape but for relevant/relevance_score instead of category - relevance
  // is now what drives report/timeline/correlation, so it gets a first-
  // class summary view of its own, not just a column in the artifact table.
  const wrap=el('div',{class:'panel'});
  wrap.append(el('h2',{style:'margin-top:0'},'Relevance breakdown'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'The primary signal this pipeline produces - regex + keyword + NER evidence combined with '+
      'a trained relevant/not_relevant model where configured. Independent of Category, which is '+
      'a display/grouping label now. Click a row for example artifacts.'));
  let d;
  try{ d=await api('/cases/'+id+'/relevance'); }
  catch(e){ wrap.append(el('div',{class:'hint'},'Could not load: '+e.message)); return wrap; }

  const t=el('table',{},el('thead',{},el('tr',{},
    ...['Relevant','Count','Mean relevance score','Mean relevance model score'].map(h=>el('th',{},h)))));
  const tb=el('tbody',{});
  d.by_relevance.forEach(row0=>{
    const key=String(row0.relevant);
    const exBox=el('div',{style:'display:none;padding:8px 0'});
    const row=el('tr',{style:'cursor:pointer',onclick:()=>{
      if(exBox.style.display==='none'){
        if(!exBox.childNodes.length){
          const examples=d.examples[key]||[];
          exBox.append(examples.length
            ? tbl(examples,['app','source_type','category','key','value','relevance_score','relevance_model_score'])
            : el('div',{class:'hint'},'no examples'));
        }
        exBox.style.display='block';
      } else exBox.style.display='none';
    }},
      el('td',{},row0.relevant?el('span',{class:'pill ok'},'relevant'):el('span',{class:'pill'},'not relevant')),
      el('td',{},row0.artifacts.toLocaleString()),
      el('td',{},row0.mean_relevance_score!=null?row0.mean_relevance_score.toFixed(3):''),
      el('td',{},row0.mean_relevance_model_score!=null?row0.mean_relevance_model_score.toFixed(3):'—'));
    tb.append(row);
    const exRow=el('tr',{}); const exCell=el('td',{colspan:'4'},exBox);
    exRow.append(exCell); tb.append(exRow);
  });
  t.append(tb);
  wrap.append(el('div',{class:'scroll'},t));
  return wrap;
}

async function correlationsPanel(id){
  // Interactive counterpart to the static report's §5 Cross-Source
  // Correlations - same build_correlation_report backing both (via the
  // /correlations endpoint, which wraps the identical agent tool), but
  // browsable instead of generated once. Phase 5 of the agent-improvement
  // plan (magical-dazzling-dragon.md).
  const wrap=el('div',{class:'panel'});
  const hint=el('div',{class:'hint',style:'margin-bottom:8px'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const expanded=new Set();
  let data=null;

  function render(){
    if(!data) return;
    if(!data.entities.length){
      hint.textContent='';
      out.innerHTML=''; out.append(el('div',{class:'hint'},
        "No identifier was found in more than one app or storage mechanism yet. Entity extraction "+
        "isn't exhaustive - app-specific id/token shapes get added over time - so this being empty "+
        "doesn't mean there's nothing to find, only that this pass didn't see it."));
      return;
    }
    hint.textContent = `${data.entity_count.toLocaleString()} identifier(s) found across more than one app or storage mechanism`;
    out.innerHTML='';
    data.entities.forEach(e=>{
      const key=e.entity_type+'::'+e.value;
      const isOpen=expanded.has(key);
      const head=el('div',{class:'row',style:'cursor:pointer;padding:8px 10px;border:1px solid var(--line);'+
        'border-radius:8px;margin-bottom:'+(isOpen?'0':'8px')+';align-items:center;gap:8px'},
        el('span',{style:'width:14px;flex-shrink:0;opacity:.7'},isOpen?'▾':'▸'),
        el('span',{class:'pill'},e.entity_type.replace(/_/g,' ')),
        el('span',{class:'mono',style:'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},e.value),
        el('span',{class:'muted',style:'flex-shrink:0'},e.apps.join(', ')),
        el('span',{class:'muted',style:'flex-shrink:0'},e.timeline.length+' artifact(s)'));
      head.onclick=()=>{ if(isOpen) expanded.delete(key); else expanded.add(key); render(); };
      out.append(head);
      if(!isOpen) return;
      const t=el('table',{style:'table-layout:fixed;width:100%;margin-bottom:12px'},el('thead',{},el('tr',{},
        ...['','Time','App','Source','Key','Value'].map(h=>el('th',{},h)))));
      const tb=el('tbody',{});
      e.timeline.forEach(c=>{
        tb.append(el('tr',{style:'cursor:pointer',title:'file: '+c.source_file+' · click for full detail',
          onclick:()=>showArtifactDetail(id,c.artifact_id)},
          el('td',{title:c.relevance_score!=null?'relevance_score: '+c.relevance_score.toFixed(2):
            'kept as corroborating evidence, not independently relevant'},
            c.relevant?el('span',{class:'pill ok'},'relevant'):''),
          el('td',{class:'mono',title:c.record_ts||''},c.record_ts?ago(c.record_ts):''),
          el('td',{},c.app),
          el('td',{},SRC_LABELS[c.source_type]||c.source_type),
          el('td',{class:'mono',style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},c.key),
          el('td',{class:'wrap'},c.value)));
      });
      t.append(tb); out.append(t);
    });
  }

  out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
  wrap.append(el('h2',{style:'margin-top:0'},'Correlations'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Identifiers (ids, invite links, emails, asset ids) that appear across more than one app or '+
      'storage mechanism - the cross-source link a single-row classifier cannot see on its own. '+
      'Click one to see every artifact it was found in, oldest first; click a row for full detail.'),
    hint, out);
  try{ data=await api('/cases/'+id+'/correlations'); }
  catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return wrap; }
  render();
  return wrap;
}

function timelinePanel(id){
  // Interactive counterpart to the static report's §7 Evidence Timeline,
  // which is generated once, hard-capped at 120 rows, and always excludes
  // GENERAL - this is paginated and filterable instead, same conventions as
  // cacheFilesPanel/browser(). The memory-derived CreateTime/ExitTime events
  // this makes reachable at all (process start/exit) came from the phase
  // immediately before this one (record_ts on Volatility's own timestamps,
  // dd_lab/memory/volatility.py) - before that, this view would have been
  // entirely disk-artifact events despite memory usually being the case's
  // largest data source.
  const wrap=el('div',{class:'panel'});
  const catSel=el('select',{}, el('option',{value:''},'all categories'));
  const appSel=el('select',{}, el('option',{value:''},'all apps'));
  const relSel=el('select',{title:'Filter by the primary relevance signal'},
    el('option',{value:''},'relevant + not relevant'),
    el('option',{value:'true'},'relevant only'),
    el('option',{value:'false'},'not relevant only'));
  const count=el('div',{class:'hint'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const pagWrap=el('div',{});
  let offset=0; const limit=100; let total=0; let facetsLoaded=false;

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    const p=new URLSearchParams({limit:String(limit), offset:String(offset)});
    if(catSel.value) p.set('category', catSel.value);
    if(appSel.value) p.set('app', appSel.value);
    if(relSel.value) p.set('relevant', relSel.value);
    let d;
    try{ d=await api('/cases/'+id+'/timeline?'+p); }
    catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    total=d.total;
    count.textContent = total
      ? `showing ${offset+1}–${offset+d.shown} of ${total.toLocaleString()} timestamped event(s)`
      : 'no timestamped events match this filter';
    if(!facetsLoaded){
      facetsLoaded=true;
      d.facets.categories.forEach(c=>catSel.append(el('option',{value:c},c)));
      d.facets.apps.forEach(a=>appSel.append(el('option',{value:a},a)));
    }
    pagWrap.innerHTML='';
    pagWrap.append(paginationBar(offset, limit, total, newOffset=>{offset=newOffset; load();}));

    const t=el('table',{style:'table-layout:fixed;width:100%'},el('thead',{},el('tr',{},
      ...['','Time','App','Category','Source','Key','Value'].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    d.rows.forEach(r=>{
      tb.append(el('tr',{style:'cursor:pointer',title:'file: '+r.source_file+' · click for full detail',
        onclick:()=>showArtifactDetail(id,r.artifact_id)},
        el('td',{title:r.relevance_score!=null?'relevance_score: '+r.relevance_score.toFixed(2):''},
          r.relevant?el('span',{class:'pill ok'},'relevant'):''),
        el('td',{class:'mono',title:r.record_ts||''},r.record_ts?ago(r.record_ts):''),
        el('td',{},r.app),
        el('td',{},el('span',{class:'pill cat'},r.category||'')),
        el('td',{},SRC_LABELS[r.source_type]||r.source_type),
        el('td',{class:'mono',style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},r.key),
        el('td',{class:'wrap'},r.value)));
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  catSel.onchange=()=>{offset=0; load();};
  appSel.onchange=()=>{offset=0; load();};
  relSel.onchange=()=>{offset=0; load();};
  wrap.append(el('h2',{style:'margin-top:0'},'Timeline'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      "Every timestamped event across the case, oldest first - process start/exit from memory "+
      "analysis included. Unlike the static report's Evidence Timeline section (capped at 120 rows, "+
      "GENERAL excluded), this is the full, paginated, filterable set."),
    el('div',{class:'row'}, relSel, catSel, appSel), count, out, pagWrap);
  load();
  return wrap;
}

async function vReport(m){
  const id=state.arg;
  // Rendered as an iframe, not window.open(): a pywebview desktop window has
  // no browser chrome to open a new tab/window in, so window.open silently
  // did nothing there. An iframe works identically in the desktop app and a
  // plain browser tab, and keeps the report's own CSS isolated from the SPA's.
  m.innerHTML='';
  m.append(el('div',{class:'row',style:'margin-bottom:10px'},
    el('button',{class:'sec',onclick:()=>go('case',id)},'←  Back to case')));
  m.append(el('iframe',{
    src:'/api/cases/'+encodeURIComponent(id)+'/report',
    style:'width:100%;height:calc(100vh - 110px);border:1px solid var(--line);border-radius:8px;background:#fff'}));
}

// Every optional artifact-table column, in display order. `always` columns
// can't be hidden; the rest are togglable via the "Columns" picker and
// remembered (COL_PREF_KEY, one flat preference shared across every view -
// a column only ever shows up in views where `need` says it's relevant, so
// one global "I want to see Filename when it's available" preference is
// enough, no per-view storage needed). `need(fixed)` says which fixed
// (app/source_type) contexts a column can even apply to - e.g. `url` only
// ever has data on cache rows.
const COL_PREF_KEY = 'dd_artifact_columns';
const ARTIFACT_COLS = [
  {k:'relevant', label:'Relevant', always:true,
    title:'The primary signal this pipeline produces — "does this matter to the investigation", '+
      'not "what kind of thing is this" (see Category). Its own combination of regex/keyword/NER '+
      'evidence plus a trained relevant/not_relevant model where configured — independent of '+
      'Category, which is display/grouping only now.'},
  {k:'relevance_score', label:'Score', def:true,
    title:'The relevance combination\'s own 0–1 score — Relevant is this crossing a threshold.'},
  {k:'category', label:'Category', def:true,
    title:'What kind of thing this is (CREDENTIAL, CHAT_CONTENT, …) — a display/grouping label, '+
      'no longer what decides Relevant.'},
  {k:'confidence', label:'Conf', def:true,
    title:'Category confidence (0–1) — how sure the rule/keyword/NER/model ensemble was about '+
      'the category specifically, not about relevance.'},
  {k:'app', label:'App', def:true, need:f=>!f.app},
  {k:'source_type', label:'Source', def:true, need:f=>!f.source_type},
  {k:'record_ts', label:'Time', def:true},
  {k:'key', label:'Key', def:true},
  {k:'value', label:'Value', always:true, wrap:true},
  {k:'source_file', label:'File', def:true,
    title:'The physical evidence file this row was read from'},
  {k:'url', label:'URL', def:true, need:f=>!f.source_type||f.source_type==='cache'},
  {k:'filename', label:'Filename', def:false, need:f=>!f.source_type||f.source_type==='cache',
    title:'A human-readable name guessed from the URL — NOT the physical file (see File)'},
  {k:'cache_offset', label:'Offset', def:false, need:f=>!f.source_type||f.source_type==='cache',
    title:'Byte offset into File backing this row'},
  {k:'latest', label:'Latest', def:true,
    need:f=>!f.source_type||['local_storage','session_storage','indexeddb'].includes(f.source_type),
    title:'Whether this is the CURRENT value of its key, or a superseded historical one (kept, not dropped)'},
  {k:'artifact_id', label:'Artifact ID', def:false},
];

function catPill(r){
  const span=el('span',{class:'pill cat cat-'+(r.category||'')},r.category||'');
  if(!r.deleted) return span;
  return [span,' ',el('span',{class:'pill bad',
    title:'Recovered from a tombstoned/overwritten LevelDB record, not the current live value'},'deleted')];
}

function artifactCell(col,r){
  switch(col.k){
    case 'category': return el('td',{},...[].concat(catPill(r)));
    case 'confidence': return el('td',{title:col.title},r.confidence!=null?r.confidence.toFixed(2):'');
    case 'relevant': return el('td',{},
      r.relevant==null?'':(r.relevant
        ? el('span',{class:'pill ok'},'relevant') : el('span',{class:'pill'},'—')));
    case 'relevance_score': return el('td',{title:col.title},r.relevance_score!=null?r.relevance_score.toFixed(2):'');
    case 'app': return el('td',{},r.app);
    case 'source_type': return el('td',{},SRC_LABELS[r.source_type]||r.source_type);
    case 'record_ts': return el('td',{title:r.record_ts||''},r.record_ts?ago(r.record_ts):'');
    case 'key': return el('td',{class:'mono'},r.key);
    case 'value': return el('td',{class:'wrap'},r.value);
    case 'source_file': return el('td',{title:r.source_file||''},r.source_file||'');
    case 'url': return el('td',{title:r.url||''},r.url||'');
    case 'filename': return el('td',{},r.filename||'');
    case 'cache_offset': return el('td',{},r.cache_offset!=null?String(r.cache_offset):'');
    case 'latest': return el('td',{},r.latest==null?'':(r.latest
      ? el('span',{class:'pill ok'},'latest') : el('span',{class:'pill'},'older')));
    case 'artifact_id': return el('td',{class:'mono'},r.artifact_id);
    default: return el('td',{},'');
  }
}

function loadColumnPrefs(){
  try{
    const saved=JSON.parse(localStorage.getItem(COL_PREF_KEY)||'null');
    if(Array.isArray(saved)) return new Set(saved);
  }catch(e){/* corrupt/blocked storage - fall through to defaults */}
  return new Set(ARTIFACT_COLS.filter(c=>c.def).map(c=>c.k));
}
function saveColumnPrefs(set){
  try{ localStorage.setItem(COL_PREF_KEY, JSON.stringify([...set])); }catch(e){/* best-effort */}
}

function browser(id,cats,fixed){
  // `fixed` (from the case explorer's left nav) pins app and/or source_type
  // - which app/source to look at is chosen there, tree-style, rather than
  // from dropdowns here. With nothing fixed (unused currently, kept for
  // re-use) it falls back to picker dropdowns for both.
  fixed = fixed || {};
  const wrap=el('div',{class:'panel'});
  const cat=el('select',{}, el('option',{value:''},'all categories'), ...cats.map(c=>el('option',{value:c},c)));
  const relSel=el('select',{title:'Filter by the primary relevance signal, independent of category'},
    el('option',{value:''},'relevant + not relevant'),
    el('option',{value:'true'},'relevant only'),
    el('option',{value:'false'},'not relevant only'));
  const sortSel=el('select',{title:'How matching rows are ordered'},
    el('option',{value:''},'sort: relevant first'),
    el('option',{value:'relevance'},'sort: relevance score'),
    el('option',{value:'confidence'},'sort: category confidence'),
    el('option',{value:'time'},'sort: time'));
  const appSel = fixed.app ? null : el('select',{}, el('option',{value:''},'all apps'));
  const srcSel = fixed.source_type ? null : el('select',{}, el('option',{value:''},'all sources'));
  // fixed.q: an initial search term the caller pins (e.g. a process detail
  // view jumping here pre-filtered to "pid<PID>:" so only that process's
  // carved strings show) - still a normal, editable search box after that.
  const q=el('input',{placeholder:'search key or value',style:'flex:1;min-width:180px',value:fixed.q||''});
  const count=el('div',{class:'hint'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const pagWrap=el('div',{});
  const dlBtn=el('a',{class:'ghost',style:'text-decoration:none;padding:8px 8px;cursor:pointer'},'⬇ Download CSV');

  // available columns for THIS view, and which of them the user currently
  // wants visible (a shared preference across every view - see ARTIFACT_COLS)
  const available = ARTIFACT_COLS.filter(c=>!c.need || c.need(fixed));
  let prefs = loadColumnPrefs();
  function visibleCols(){ return available.filter(c=>c.always || prefs.has(c.k)); }

  const colBtn=el('button',{class:'sec'},'Columns ▾');
  const colPanel=el('div',{class:'colpanel'});
  colPanel.hidden=true;
  available.filter(c=>!c.always).forEach(c=>{
    const cb=el('input',{type:'checkbox'});
    cb.checked=prefs.has(c.k);
    cb.onchange=()=>{
      if(cb.checked) prefs.add(c.k); else prefs.delete(c.k);
      saveColumnPrefs(prefs); renderTable();
    };
    colPanel.append(el('label',{title:c.title||''},cb,c.label));
  });
  colBtn.onclick=e=>{ e.stopPropagation(); colPanel.hidden=!colPanel.hidden; };
  colPanel.onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>{colPanel.hidden=true;});
  const colPicker=el('div',{class:'colpicker'},colBtn,colPanel);

  let facetsLoaded=false, offset=0, lastRows=[], lastD=null; const limit=100;
  function currentParams(){
    const p=new URLSearchParams();
    if(cat.value)p.set('category',cat.value);
    if(relSel.value)p.set('relevant',relSel.value);
    if(sortSel.value)p.set('sort',sortSel.value);
    if(fixed.app) p.set('app',fixed.app); else if(appSel.value) p.set('app',appSel.value);
    if(fixed.source_type) p.set('source_type',fixed.source_type); else if(srcSel.value) p.set('source_type',srcSel.value);
    if(q.value)p.set('q',q.value);
    return p;
  }
  function renderTable(){
    const cols=visibleCols();
    const t=el('table',{class:'artifacts'},el('thead',{},el('tr',{},
      ...cols.map(c=>el('th',{title:c.title||''},c.label)))));
    const tb=el('tbody',{});
    lastRows.forEach(r=>{
      const rowTitle=(r.deleted?'RECOVERED (deleted record) · ':'')+(r.source_file?'file: '+r.source_file:'')+
        ' · click for full detail';
      tb.append(el('tr',{title:rowTitle,onclick:()=>showArtifactDetail(id,r.artifact_id)},
        ...cols.map(c=>artifactCell(c,r))));
    });
    t.append(tb); out.innerHTML=''; out.append(t);
    pagWrap.innerHTML='';
    if(lastD){
      count.textContent = lastD.total
        ? `showing ${offset+1}–${offset+lastD.shown} of ${lastD.total.toLocaleString()} matching`
        : 'no matching artifacts';
      pagWrap.append(paginationBar(offset, limit, lastD.total, newOffset=>{offset=newOffset; load();}));
    }
  }
  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    const p=currentParams();
    p.set('limit',String(limit)); p.set('offset',String(offset));
    dlBtn.href='/api'+'/cases/'+id+'/artifacts/export.csv?'+currentParams();
    const d=await api('/cases/'+id+'/artifacts?'+p);
    if(!facetsLoaded && d.facets){
      if(appSel) d.facets.apps.forEach(a=>appSel.append(el('option',{value:a},a)));
      if(srcSel) d.facets.source_types.forEach(s=>srcSel.append(el('option',{value:s},s)));
      facetsLoaded=true;
    }
    lastRows=d.rows; lastD=d;
    renderTable();
  }
  cat.onchange=()=>{offset=0; load();};
  relSel.onchange=()=>{offset=0; load();};
  sortSel.onchange=()=>{offset=0; load();};
  if(appSel) appSel.onchange=()=>{offset=0; load();};
  if(srcSel) srcSel.onchange=()=>{offset=0; load();};
  let tmo; q.oninput=()=>{clearTimeout(tmo);tmo=setTimeout(()=>{offset=0; load();},300);};
  const heading = fixed.app
    ? fixed.source_type ? `${fixed.app} → ${SRC_LABELS[fixed.source_type]||fixed.source_type}` : `${fixed.app} → all sources`
    : 'Artifact browser';
  wrap.append(el('div',{class:'row'},
      el('h2',{style:'margin:0'},heading), el('span',{style:'flex:1'}), colPicker, dlBtn),
    el('div',{class:'row',style:'margin-top:8px'},relSel, sortSel, cat, ...(appSel?[appSel]:[]), ...(srcSel?[srcSel]:[]), q),
    count, out, pagWrap);
  load();
  return wrap;
}

function fmtBytes(n){
  if(n==null) return '';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

// Shared First/Prev/[page numbers]/Next/Last control, used everywhere a
// list is paginated (the artifact table, cache/local-storage/database file
// listings, a Local Storage file's own record dump). `goto(newOffset)` is
// the caller's job - it re-fetches/re-renders at that offset; this only
// works out which offset each button means. Rebuilt fresh on every render
// (same pattern as everything else here) rather than patched in place.
function paginationBar(offset, limit, total, goto){
  const bar=el('div',{class:'row',style:'margin-top:8px;flex-wrap:wrap;gap:4px'});
  if(!total) return bar;
  const lastPage=Math.max(0, Math.ceil(total/limit)-1);
  const curPage=Math.min(lastPage, Math.floor(offset/limit));
  function btn(label,page,opts={}){
    return el('button',{class:opts.active?'primary':'sec',
      style:'padding:6px 11px;font-size:12.5px'+(opts.active?'':';opacity:.85'),
      disabled:!!opts.disabled, onclick:()=>goto(page*limit)}, label);
  }
  bar.append(btn('« First',0,{disabled:curPage<=0}));
  bar.append(btn('‹ Prev',Math.max(0,curPage-1),{disabled:curPage<=0}));
  const WINDOW=2;
  const start=Math.max(0,curPage-WINDOW), end=Math.min(lastPage,curPage+WINDOW);
  if(start>0){
    bar.append(btn('1',0));
    if(start>1) bar.append(el('span',{class:'muted',style:'padding:0 2px'},'…'));
  }
  for(let p=start;p<=end;p++) bar.append(btn(String(p+1),p,{active:p===curPage}));
  if(end<lastPage){
    if(end<lastPage-1) bar.append(el('span',{class:'muted',style:'padding:0 2px'},'…'));
    bar.append(btn(String(lastPage+1),lastPage));
  }
  bar.append(btn('Next ›',Math.min(lastPage,curPage+1),{disabled:curPage>=lastPage}));
  bar.append(btn('Last »',lastPage,{disabled:curPage>=lastPage}));
  return bar;
}

  // evidence directory via /cache-files, independent of whether analysis
  // has run.

    const tb=el('tbody',{});

function localStorageFilesPanel(id, app){
  // The Local Storage equivalent of cacheFilesPanel - but a LevelDB key
  // isn't pinned to one physical file the way a cache entry is (compaction
  // moves it between .ldb files over time), so this lists the physical
  // store files themselves (name, kind, size, record count) rather than
  // one row per key. "Open" expands a raw record dump read directly from
  // that one file - real .ldb/.log parsing, not the merged logical view.
  const wrap=el('div',{class:'panel'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    let d;
    try{ d=await api('/cases/'+id+'/localstorage-files?app='+encodeURIComponent(app)); }
    catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    if(!d.files.length){ out.innerHTML=''; out.append(el('div',{class:'hint'},'No Local Storage files found for this app.')); return; }
    // table-layout:fixed - otherwise an expanded file's record dump (long,
    // nowrap "value" cells inside recTable) blows the WHOLE table out to
    // tens of thousands of pixels wide (confirmed: 284,612px in one real
    // case), pushing this row's own Open/Close chevron far outside the
    // viewport - not actually gone, just rendered off-screen. Fixed column
    // widths (from the header row) mean recTable's own overflow:auto is
    // what scrolls wide content now, not the whole table growing.
    const t=el('table',{style:'table-layout:fixed;width:100%'},el('thead',{},el('tr',{},
      ...['Filename','Kind','Size','Records',''].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    d.files.forEach(f=>{
      // Records render into their own capped, independently-scrolling box
      // (max-height, not the unbounded default) - otherwise opening one
      // file's up-to-100-row record dump inline could push every OTHER
      // file's row far enough down the page to look like it vanished.
      const recTable=el('div',{style:'max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:6px'});
      const recHint=el('div',{class:'hint',style:'margin:8px 0 6px'});
      const recPag=el('div',{});
      const recBox=el('div',{style:'display:none;padding:8px 0'},recHint,recTable,recPag);
      let recOffset=0; const recLimit=100;
      async function loadRecords(){
        recTable.innerHTML='<div class="muted" style="padding:8px">loading…</div>';
        const rp=new URLSearchParams({app, file:f.filename, limit:String(recLimit), offset:String(recOffset)});
        const rd=await api('/cases/'+id+'/localstorage-files/open?'+rp);
        recHint.textContent=`showing ${recOffset+1}–${recOffset+rd.shown} of ${rd.total.toLocaleString()} record(s) in ${f.filename}`+
          (rd.truncated?' — file ended early (a corrupt/partial record was hit)':'');
        recTable.innerHTML=''; recTable.append(tbl(rd.records,['key','value','state','seq']));
        recPag.innerHTML=''; recPag.append(paginationBar(recOffset, recLimit, rd.total,
          newOffset=>{recOffset=newOffset; loadRecords();}));
      }
      const chevron=el('span',{style:'display:inline-block;width:14px;text-align:center;opacity:.7'},'▸');
      const toggleLabel=el('span',{},'Open');
      const row=el('tr',{style:'cursor:pointer',title:'Click to expand/collapse this file\'s raw records',onclick:()=>{
        const opening = recBox.style.display==='none';
        recBox.style.display = opening?'block':'none';
        chevron.textContent = opening?'▾':'▸';
        toggleLabel.textContent = opening?'Close':'Open';
        if(opening){ recOffset=0; loadRecords(); }
      }},
        el('td',{class:'mono'},f.filename),
        el('td',{},f.kind),
        el('td',{},fmtBytes(f.size_bytes)),
        el('td',{},f.record_count!=null?f.record_count.toLocaleString()+(f.truncated?' (partial)':''):'—'),
        el('td',{},chevron,' ',toggleLabel));
      tb.append(row);
      const recRow=el('tr',{}); recRow.append(el('td',{colspan:'5'},recBox)); tb.append(recRow);
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  wrap.append(el('h2',{style:'margin-top:0'},app+' → Local Storage → Files'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Every physical .ldb/.log file in this app\'s Local Storage store, read directly - '+
      'raw records from that one file, including deleted/overwritten entries still '+
      'physically present, not the merged logical view the analysis pipeline uses.'),
    out);
  load();
  return wrap;
}

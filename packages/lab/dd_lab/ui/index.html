<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Detective</title>
<style>
  :root{--bg:#f6f6f7;--panel:#fff;--fg:#1c1c1e;--muted:#6b7280;--line:#e4e4e7;--accent:#7c1d1d;--accent2:#1d4ed8;--ok:#15803d;--bad:#b91c1c}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg);display:flex;height:100vh;overflow:hidden}
  nav{width:190px;background:#17171a;color:#d4d4d8;padding:18px 0;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
  nav .brand{font-weight:700;font-size:15px;color:#fff;padding:0 20px 16px}
  nav a{padding:9px 20px;cursor:pointer;color:#a1a1aa;text-decoration:none;font-size:13px}
  nav a.active,nav a:hover{background:#27272a;color:#fff}
  nav .foot{margin-top:auto;padding:12px 20px;font-size:11px;color:#71717a}
  main{flex:1;overflow:auto;padding:26px 34px}
  h1{font-size:20px;margin:0 0 18px}h2{font-size:15px;margin:24px 0 10px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center}
  .card .n{font-size:26px;font-weight:700}.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:var(--accent2);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;transition:filter .1s}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button.primary{padding:10px 20px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  button.sec{background:#e8e8ea;color:#27272a}
  button.ghost{background:transparent;color:var(--accent2);padding:8px 8px}
  button.danger{background:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:14px;color:var(--muted);font-size:13px}
  .spin-lg{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite}
  .statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .sd-completed{background:var(--ok)}.sd-running{background:#d97706}.sd-error{background:var(--bad)}.sd-new{background:#9ca3af}
  input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;background:#fff}
  input,select{height:34px}textarea{width:100%;min-height:64px}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f4f4f5;position:sticky;top:0}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#e4e4e7}
  .pill.ok{background:#dcfce7;color:var(--ok)}.pill.bad{background:#fee2e2;color:var(--bad)}
  .pill.cat{background:#eef2ff;color:#3730a3}
  .bar{height:16px;background:var(--accent2);border-radius:3px;min-width:2px}
  .barrow{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center;margin:3px 0;font-size:12px}
  .log{background:#0b0b0d;color:#c7f5c7;font:11px/1.45 ui-monospace,Menlo,monospace;padding:10px;border-radius:7px;max-height:230px;overflow:auto;white-space:pre-wrap}
  .muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all}
  .scroll{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  /* tbl() cells: unlike .mono, short columns (seq/ts/kind/name/...) must never
     shrink to nothing when a `detail` cell on the same row holds a big JSON
     blob — word-break:break-all lets the browser's table layout treat them as
     infinitely compressible, which wraps them one character per line. */
  .tbl-cell{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}
  .tbl-detail{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;word-break:break-word;max-width:640px}
  a.link{color:var(--accent2);cursor:pointer}
</style>
</head>
<body>
<nav>
  <div class="brand">🔍 Digital Detective</div>
  <a data-view="dashboard">Dashboard</a>
  <a data-view="import">Import</a>
  <a data-view="cases">Cases</a>
  <a data-view="settings">Settings</a>
  <div class="foot" id="jobs"></div>
  <div class="foot" id="conn">connecting…</div>
</nav>
<main id="main"><div class="center-loading"><div class="spin-lg"></div><div>Loading…</div></div></main>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v);}k.flat().forEach(c=>e.append(c?.nodeType?c:document.createTextNode(c??'')));return e;};
const loadingView = (msg)=>el('div',{class:'center-loading'},el('div',{class:'spin-lg'}),el('div',{},msg||'Loading…'));
const api = async (p,opt)=>{const r=await fetch('/api'+p,opt&&{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail);return r.headers.get('content-type')?.includes('json')?r.json():r.text();};
const state = {view:'dashboard', arg:null, unsavedWork:null};

function nav(){document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.dataset.view===state.view);a.onclick=()=>go(a.dataset.view);});}
function go(view,arg){
  // Background jobs (extraction, analysis) run on a server-side worker
  // thread and are unaffected by navigating the UI. A handful of short,
  // non-job operations are not (currently: scanning an image) - state.unsavedWork
  // names one of those while it's in flight, so leaving can actually lose it.
  if(state.unsavedWork && !confirm(state.unsavedWork+' is still in progress and will be lost if you leave this page. Leave anyway?')) return;
  state.unsavedWork=null;
  state.view=view;state.arg=arg||null;location.hash=view+(arg?'/'+arg:'');nav();render();
}
window.addEventListener('hashchange',()=>{const[v,a]=location.hash.slice(1).split('/');if(v&&v!==state.view||a!==state.arg){state.view=v||'dashboard';state.arg=a||null;nav();render();}});

// Persistent, app-wide indicator: a background job stays visible (and known
// to genuinely still be running) no matter which page is open.
async function pollActiveJobs(){
  const box=$('#jobs');
  try{
    const d=await api('/jobs');
    box.textContent = d.jobs.length ? `● ${d.jobs.length} job${d.jobs.length>1?'s':''} running` : '';
    box.style.color = d.jobs.length ? '#d97706' : '';
  }catch(e){ /* transient - leave the indicator as it was */ }
}
setInterval(pollActiveJobs, 3000);

const _loadingMsg = {case:'Opening case…', report:'Loading report…', cases:'Loading cases…', import:'Loading…', settings:'Loading settings…', dashboard:'Loading…', cacheentry:'Opening cache entry…'};
async function render(){
  const m=$('#main'); m.innerHTML=''; m.append(loadingView(_loadingMsg[state.view]));
  try{ await ({dashboard:vDashboard,import:vImport,cases:vCases,case:vCase,report:vReport,settings:vSettings,cacheentry:vCacheEntry}[state.view]||vDashboard)(m); }
  catch(e){ m.innerHTML=''; m.append(el('div',{class:'panel'},'Error: '+e.message)); }
}

async function vDashboard(m){
  const d=await api('/cases');
  m.innerHTML=''; m.append(el('h1',{},'Dashboard'));
  const c=d.counts;
  m.append(el('div',{class:'cards'},
    ...[['Total',c.total],['Running',c.running],['Completed',c.completed],['Stopped',c.stopped]]
      .map(([l,n])=>el('div',{class:'card'},el('div',{class:'n'},String(n)),el('div',{class:'l'},l)))));
  m.append(el('h2',{},'Cases'));
  if(!d.cases.length) m.append(el('div',{class:'panel muted'},
    'No cases yet. Go to Collect to acquire evidence, then Cases to open it.'));
  d.cases.forEach(cs=>{
    const incomplete = cs.status==='error' && (cs.last_message||'').includes('incomplete acquisition');
    m.append(el('div',{class:'panel'},
      el('div',{class:'row'},
        el('span',{class:'statusdot sd-'+cs.status}), el('b',{},cs.name),
        el('span',{class:'muted mono'},cs.case_id),
        el('span',{style:'flex:1'}),
        incomplete
          ? el('span',{class:'pill bad'},'incomplete — re-collect')
          : el('button',{class:'sec',onclick:()=>go('case',cs.case_id)},
              cs.status==='completed'?'Open':'Open')),
      cs.keywords?.length?el('div',{class:'muted',style:'margin-top:6px'},'keywords: '+cs.keywords.join(', ')):'',
      cs.last_message?el('div',{class:'hint'},cs.last_message):''));
  });
}

async function vImport(m){
  // This application never collects evidence live from the machine it runs
  // on. Evidence is brought in two ways: a case produced by the dedicated
  // field-collection utility, or a forensic image processed below.
  m.innerHTML=''; m.append(el('h1',{},'Import Evidence'));
  m.append(el('div',{class:'hint',style:'margin-bottom:14px'},
    'This application does not perform live collection on the machine it runs on. '+
    'A case is brought in either as evidence already acquired by the field '+
    'collection utility, or by processing a forensic image directly, below.'));
  m.append(imageImportPanel());
}

function imageImportPanel(){
  const box=el('div',{class:'panel'});
  box.append(el('h2',{style:'margin-top:0'},'Process a Forensic Image'),
    el('div',{class:'hint',style:'margin-bottom:10px'},
      'Supports raw/dd images (including split segments), VMDK and VHD/VHDX virtual '+
      'disks, and E01/EWF containers. The image is opened read-only; nothing on it is '+
      'ever modified.'));

  const path=el('input',{placeholder:'/path/to/image.raw or E:\\case.E01',style:'width:420px'});
  const browsePath=el('button',{class:'sec',onclick:()=>browseForFile(path)},'Browse…');
  const scanLog=el('div',{class:'hint'});
  const appsBox=el('div',{style:'display:none;margin-top:10px'});
  const checks=[];

  const scanBtn=el('button',{class:'sec',onclick:async()=>{
    if(!path.value.trim()) return alert('Enter an image path first.');
    scanBtn.disabled=true; scanBtn.innerHTML='<span class="spin" style="border-color:#0003;border-top-color:#333"></span>Scanning…';
    scanLog.innerHTML='<span class="spin" style="border-color:#0003;border-top-color:#333"></span>Opening the image and searching for application profiles — this can take a moment on a large image.';
    appsBox.style.display='none'; appsBox.innerHTML=''; checks.length=0;
    state.unsavedWork='The image scan';
    try{
      const d=await api('/image/list',{method:'POST',body:JSON.stringify({image_path:path.value.trim()})});
      scanLog.textContent='';
      if(!d.apps.length){ scanLog.textContent='No supported application profiles were found on this image.'; }
      else{
        appsBox.style.display='block';
        d.apps.forEach(a=>{
          const cb=el('input',{type:'checkbox',checked:''}); checks.push([cb,a]);
          appsBox.append(el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:6px'},
            cb, el('span',{},el('b',{},a.name), a.version?' v'+a.version:''),
            el('span',{class:'muted mono',style:'flex:1;text-align:right'},a.profile_dir)));
        });
      }
    }catch(e){ scanLog.textContent='The image could not be opened: '+e.message; }
    state.unsavedWork=null;
    scanBtn.disabled=false; scanBtn.textContent='Scan Image';
  }},'Scan Image');

  box.append(el('label',{},'Image path (readable by this machine)'),
    el('div',{class:'row'}, path, browsePath),
    el('div',{class:'row',style:'margin-top:8px'}, scanBtn), scanLog, appsBox);

  const op=el('input',{placeholder:'e.g. Det. A. Smith',style:'width:300px'});
  const memImg=el('input',{placeholder:'optional',style:'width:420px'});
  const browseMemImg=el('button',{class:'sec',onclick:()=>browseForFile(
    memImg,['Memory dumps (*.raw;*.dmp;*.mem;*.bin)','All files (*.*)'])},'Browse…');
  const cid=el('input',{placeholder:'generated automatically if left blank',style:'width:300px'});
  box.append(
    el('label',{},'Operator name (recorded in the chain of custody)'), op,
    el('label',{},'Memory image (optional — a full-RAM capture acquired separately)'),
    el('div',{class:'row'}, memImg, browseMemImg),
    el('label',{},'Case ID (optional)'), cid);

  const bgHint=el('div',{class:'hint',style:'display:none;margin-top:8px'},
    'Running in the background — this page can be left safely; progress is also '+
    'shown in the sidebar and on the Cases page.');
  const log=el('div',{class:'log',style:'display:none;margin-top:8px'});
  const done=el('div',{style:'display:none;margin-top:12px'});
  const btn=el('button',{class:'primary',style:'margin-top:16px',onclick:async()=>{
    if(!path.value.trim()) return alert('Enter an image path first.');
    const chosen = checks.length ? checks.filter(([c])=>c.checked).map(([,a])=>a.name) : null;
    if(checks.length && !chosen.length) return alert('Select at least one application, or scan the image first.');
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>Starting…';
    log.style.display='block'; log.textContent=''; done.style.display='none'; bgHint.style.display='none';
    try{
      const r=await api('/image/extract',{method:'POST',body:JSON.stringify({
        image_path:path.value.trim(), apps:chosen, operator:op.value,
        memory_image_path:memImg.value||null, case_id:cid.value||null})});
      btn.innerHTML='<span class="spin"></span>Processing…'; bgHint.style.display='block';
      const j=await pollJob(r.job_id,log);
      if(j && j.status==='done' && j.result){
        done.style.display='block'; done.innerHTML='';
        done.append(
          el('b',{},`Case ${j.result.case_id} created`),
          el('div',{class:'hint'},`${j.result.files} files · ${(j.result.bytes/1e6).toFixed(1)} MB · `+
            `image checksum ${j.result.image_sha256.slice(0,16)}… · signing key ${j.result.fingerprint}` +
            (j.result.warnings?.length?` · ${j.result.warnings.length} warning(s)`:'')),
          el('button',{style:'margin-top:8px',onclick:()=>{state.newCaseId=j.result.case_id;go('cases');}},
            'Create a case from this →'));
      }
    }catch(e){ log.textContent+='\nCould not start: '+e.message; }
    btn.disabled=false; btn.textContent='Extract from Image';
  }},'Extract from Image');
  box.append(btn, bgHint, log, done);
  return box;
}

async function browseForFile(inputEl,fileTypes){
  // Native picker (pywebview desktop window only) returns the real local
  // path with no file transfer at all — the right choice for a forensic
  // image/memory dump that can be tens of GB, unlike an actual browser
  // upload which would mean copying the whole thing over HTTP first.
  if(!(window.pywebview && window.pywebview.api && window.pywebview.api.pick_file)){
    alert('Native file browsing needs the desktop app window (not a plain browser tab) — type the path instead.');
    return;
  }
  try{
    const p=await window.pywebview.api.pick_file(fileTypes||null);
    if(p) inputEl.value=p;
  }catch(e){ alert('Could not open the file picker: '+e.message); }
}

async function pollJob(id,logEl,onDone){
  while(true){
    let j; try{ j=await api('/jobs/'+id); }catch(e){ logEl.textContent+='\n(lost contact with the job)'; return; }
    logEl.textContent=j.log.map(l=>l.msg).join('\n');
    if(j.status==='error') logEl.textContent+='\n\n✗ FAILED: '+((j.error||'').split('\n')[0]);
    if(j.status==='done')  logEl.textContent+='\n\n✓ done';
    logEl.scrollTop=logEl.scrollHeight;
    if(j.status==='done'||j.status==='error'){
      if(onDone) setTimeout(()=>onDone(j), 900);   // let the user see the final line
      return j;
    }
    await new Promise(r=>setTimeout(r,700));
  }
}

async function vCases(m){
  const d=await api('/cases');
  m.innerHTML=''; m.append(el('h1',{},'Cases'));
  const pre = state.newCaseId; state.newCaseId=null;
  const cidI=el('input',{id:'ncid',placeholder:'the acquired evidence folder name',style:'width:300px',value:pre||''});
  const createBtn=el('button',{class:'primary',style:'margin-top:14px',onclick:async(e)=>{
    const cid=cidI.value.trim(), name=$('#nname').value.trim();
    if(!cid||!name) return alert('Case ID and name are required.');
    const btn=e.target;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>Creating…';
    try{
      await api('/cases',{method:'POST',body:JSON.stringify({case_id:cid,name,
        keywords:$('#nkw').value,description:$('#ndesc').value})});
      go('case',cid);
    }catch(err){ alert(err.message); btn.disabled=false; btn.textContent='Create case'; }
  }},'Create case');
  m.append(el('div',{class:'panel'},
    el('b',{},'New case'),
    el('div',{class:'hint'},'A case pairs an acquired evidence folder with a name and the keywords you want investigated. The Case ID must match a folder already present in the cases directory (Settings).'),
    el('label',{},'Case ID'), cidI,
    el('label',{},'Case name'), el('input',{id:'nname',placeholder:'e.g. Discord DM review',style:'width:420px'}),
    el('label',{},'Investigation keywords (comma or newline separated)'),
    el('textarea',{id:'nkw',placeholder:'gift card, payment, username_of_interest'}),
    el('label',{},'Description (optional)'), el('textarea',{id:'ndesc'}),
    createBtn));
  m.append(el('h2',{},'All cases'));
  if(!d.cases.length) m.append(el('div',{class:'panel hint'},'None yet.'));
  d.cases.forEach(cs=>{
    const incomplete = cs.status==='error' && (cs.last_message||'').includes('incomplete acquisition');
    m.append(el('div',{class:'panel'},
      el('div',{class:'row'},
        el('span',{class:'statusdot sd-'+cs.status}), el('b',{},cs.name),
        el('span',{class:'muted mono'},cs.case_id), el('span',{style:'flex:1'}),
        incomplete
          ? el('span',{class:'pill bad'},'incomplete — re-collect')
          : el('button',{class:'sec',onclick:()=>go('case',cs.case_id)},'Open')),
      cs.last_message?el('div',{class:'hint'},cs.last_message):''));
  });
}

function ago(iso){
  if(!iso) return '';
  const s=Math.max(0,(Date.now()-new Date(iso))/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+' min ago';
  if(s<86400) return Math.round(s/3600)+' h ago';
  return Math.round(s/86400)+' d ago';
}

async function vCase(m){
  const id=state.arg;
  let d;
  try{ d=await api('/cases/'+encodeURIComponent(id)); }
  catch(e){
    m.innerHTML='';
    m.append(el('h1',{},id));
    m.append(el('div',{class:'panel'},
      el('b',{},'This case can’t be opened.'),
      el('div',{class:'hint'},e.message.includes('not found')
        ? 'There is no signed manifest.json in this folder — the acquisition did not finish. Re-run the collector for this case (close the target apps first so their databases aren’t locked).'
        : e.message),
      el('div',{class:'row',style:'margin-top:10px'},
        el('button',{class:'sec',onclick:()=>go('import')},'Go to Import'),
        el('button',{class:'ghost',onclick:()=>go('cases')},'Back to Cases'))));
    return;
  }

  const iv=d.integrity, w=d.warehouse;
  const job=d.active_job;
  const running = job && (job.status==='queued'||job.status==='running');
  const processed = !!w;

  m.innerHTML='';
  m.append(el('div',{class:'row'},
    el('h1',{style:'margin:0'},d.meta.name),
    el('span',{class:'muted mono'},id)));

  // --- evidence + integrity -------------------------------------------------
  const integ = el('div',{class:'row',style:'margin-top:10px'});
  if(iv.ok){
    integ.append(el('span',{class:'pill ok'},'✓ integrity verified'),
      el('span',{class:'muted'},'checked '+ago(iv.verified_ts)),
      el('button',{class:'ghost',onclick:async(e)=>{
        e.target.textContent='checking…'; e.target.disabled=true;
        try{ await api('/cases/'+id+'/verify',{method:'POST'}); go('case',id); }
        catch(x){ alert(x.message); e.target.disabled=false; e.target.textContent='re-check'; }
      }},'re-check'));
  } else {
    integ.append(el('span',{class:'pill bad'},'⚠ INTEGRITY FAILED'),
      el('span',{class:'muted'},`${iv.issues.length} issue(s) — signature valid: ${iv.signature_valid}`));
  }
  m.append(el('div',{class:'panel'},
    integ,
    el('div',{class:'hint'},
      `${iv.files} files · ${d.evidence.apps.join(', ')} · `+
      `${(d.evidence.bytes/1e6).toFixed(1)} MB · acquired on ${d.evidence.host}`),
    d.meta.keywords.length?el('div',{class:'hint'},'keywords: '+d.meta.keywords.join(', ')):'',
    !iv.ok?el('div',{class:'scroll',style:'margin-top:8px'},
      tbl(iv.issues,['kind','path','expected','actual'])):''));

  // These three read straight off the evidence directory, so they work
  // whether or not "Run analysis" has happened yet. Once the case is
  // processed they move into the explorer's left nav below (so they aren't
  // duplicated); until then they're shown here on their own.
  if(!processed && d.evidence.apps.length){
    m.append(cacheFilesPanel(id, d.evidence.apps));
    m.append(localStorageFilesPanel(id, d.evidence.apps));
    m.append(databaseFilesPanel(id, d.evidence.apps));
  }

  // --- the primary action panel ------------------------------------------
  const actions=el('div',{class:'panel'});
  const runlog=el('div',{id:'runlog',class:'log',style:'display:none;margin-top:10px'});

  async function startRun(btn){
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>starting…';
    runlog.style.display='block'; runlog.textContent='';
    try{
      const r=await api('/cases/'+id+'/run',{method:'POST'});
      await pollJob(r.job_id,runlog,()=>go('case',id));
    }catch(err){
      runlog.textContent='Could not start: '+err.message;
      btn.disabled=false; btn.textContent='Run analysis';
    }
  }

  if(running){
    actions.append(
      el('div',{class:'row'},
        el('span',{class:'spin',style:'border-color:#0003;border-top-color:#333'}),
        el('b',{},'Analysis running…'),
        el('span',{class:'muted'},'this can take a minute for a large cache')),
      runlog);
    pollJob(job.id,runlog,()=>go('case',id));
  } else if(!processed){
    const b=el('button',{class:'primary',onclick:e=>startRun(e.target)},'▶  Run analysis');
    actions.append(b,
      el('div',{class:'hint'},'Verifies every file against the signed manifest, then parses, '+
        'classifies, analyses any memory dumps, and builds the report.'),
      job&&job.status==='error'?el('div',{class:'hint',style:'color:var(--bad)'},
        'Previous run failed — '+(job.error||'').split('\n')[0]):'',
      runlog);
  } else {
    actions.append(el('div',{class:'row'},
      d.reports.length?el('button',{class:'primary',onclick:()=>go('report',id)},'📄  Open report'):'',
      el('button',{class:'sec',onclick:e=>startRun(e.target)},'↻  Re-run analysis'),
      el('button',{class:'sec',onclick:()=>document.getElementById('browser')
        ?.scrollIntoView({behavior:'smooth'})},'🔍  Browse artifacts'),
      el('button',{class:'ghost',onclick:()=>showAudit(id)},'📋  Audit trail')),
      el('div',{class:'hint'},
        `${w.artifacts.toLocaleString()} artifacts · ${w.high_priority} high-priority · `+
        (job&&job.updated_ts?'analysed '+ago(job.updated_ts):'')),
      runlog);
  }
  m.append(actions);

  // --- results: a left-nav explorer (app -> source type, each with a
  // count - the same drill-down shape a tool like Magnet AXIOM uses) driving
  // a right-hand content pane. ---------------------------------------------
  if(processed){
    const explorer=await caseExplorer(id, w, d.evidence.apps);
    explorer.id='browser'; m.append(explorer);
  }
}

const SRC_LABELS = {
  local_storage:'Local Storage', session_storage:'Session Storage', indexeddb:'IndexedDB',
  cache:'Cache', cookies:'Cookies', preferences:'Preferences', local_state:'Local State',
  memory_string:'Memory Strings', memory_process:'Memory Processes',
  memory_network:'Memory Network', memory_artifact:'Memory Artifacts',
};

async function caseExplorer(id, w, evidenceApps){
  const nav=el('div',{class:'panel',style:'width:240px;flex-shrink:0;align-self:flex-start;position:sticky;top:0;max-height:calc(100vh - 140px);overflow:auto'});
  const content=el('div',{style:'flex:1;min-width:0'});
  const wrap=el('div',{style:'display:flex;gap:16px;align-items:flex-start'}, nav, content);

  let tree;
  try{ tree=await api('/cases/'+id+'/artifact-tree'); }
  catch(e){ tree={apps:[]}; }
  const sel = state.explorerSelection && state.explorerSelection.caseId===id
    ? state.explorerSelection : {type:'overview'};
  state.explorerSelection = {...sel, caseId:id};

  function navRow(label,count,active,onclick,indent,icon){
    return el('div',{onclick,
      style:`cursor:pointer;padding:6px ${8+indent*14}px;border-radius:6px;font-size:12.5px;`+
        `display:flex;align-items:center;gap:6px;margin:1px 0;`+
        (active?`background:var(--accent2);color:#fff`:`color:var(--fg)`)},
      icon?el('span',{class:'nav-chevron',style:'width:12px;flex-shrink:0;text-align:center;opacity:.7'},icon):'',
      el('span',{style:'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},label),
      count!=null?el('span',{style:(active?'':'color:var(--muted)')+';flex-shrink:0'},count.toLocaleString()):'');
  }
  const expandedApps = new Set();  // collapsed by default; persists across renderNav() calls
  function toggleExpand(app){
    if(expandedApps.has(app)) expandedApps.delete(app); else expandedApps.add(app);
    renderNav();
  }

  async function select(next){
    state.explorerSelection={...next, caseId:id};
    renderNav();
    content.innerHTML=''; content.append(await paneFor(next));
  }
  async function paneFor(s){
    if(s.type==='cache') return cacheFilesPanel(id, evidenceApps);
    if(s.type==='lsfiles') return localStorageFilesPanel(id, evidenceApps);
    if(s.type==='dbfiles') return databaseFilesPanel(id, evidenceApps);
    if(s.type==='source') return browser(id, w.by_category.map(c=>c.category).filter(Boolean),
      {app:s.app, source_type:s.source_type});
    return overviewPanel(id, w);
  }

  function renderNav(){
    nav.innerHTML='';
    const s=state.explorerSelection;
    nav.append(el('div',{style:'font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 8px'},'Explore'));
    nav.append(navRow('Overview', null, s.type==='overview', ()=>select({type:'overview'}), 0));
    nav.append(navRow('Cache files', null, s.type==='cache', ()=>select({type:'cache'}), 0));
    nav.append(navRow('Local Storage files', null, s.type==='lsfiles', ()=>select({type:'lsfiles'}), 0));
    nav.append(navRow('Database files', null, s.type==='dbfiles', ()=>select({type:'dbfiles'}), 0));
    nav.append(el('div',{style:'height:1px;background:var(--line);margin:10px 0'}));
    tree.apps.forEach(a=>{
      // Collapsed by default (a dropdown, not an always-expanded dump);
      // stays open once toggled, and auto-opens for the app currently
      // being browsed so navigating into one of its sources doesn't hide it.
      const isOpen = expandedApps.has(a.app) || (s.type==='source' && s.app===a.app);
      const row = navRow(a.app, a.total, s.type==='source'&&s.app===a.app&&!s.source_type,
        ()=>select({type:'source', app:a.app, source_type:null}), 0, isOpen?'▾':'▸');
      const chevron = row.querySelector('.nav-chevron');
      chevron.onclick = (e)=>{ e.stopPropagation(); toggleExpand(a.app); };
      nav.append(row);
      if(isOpen) a.sources.forEach(src=>{
        const active = s.type==='source' && s.app===a.app && s.source_type===src.source_type;
        nav.append(navRow(SRC_LABELS[src.source_type]||src.source_type, src.n, active,
          ()=>select({type:'source', app:a.app, source_type:src.source_type}), 1));
      });
    });
    if(!tree.apps.length) nav.append(el('div',{class:'hint'},'No artifact breakdown available.'));
  }

  renderNav();
  content.append(await paneFor(state.explorerSelection));
  return wrap;
}

async function overviewPanel(id, w){
  const box=el('div',{});
  const max=Math.max(...w.by_category.map(c=>c.artifacts),1);
  const bars=el('div',{class:'panel'});
  bars.append(el('h2',{style:'margin-top:0'},'Artifact categories'));
  w.by_category.filter(c=>c.category).forEach(c=>bars.append(el('div',{class:'barrow'},
    el('span',{class:'pill cat'},c.category),
    el('div',{class:'bar',style:`width:${100*c.artifacts/max}%`}),
    el('span',{class:'muted'},c.artifacts.toLocaleString()))));
  box.append(bars);
  box.append(await classificationPanel(id));
  return box;
}

async function classificationPanel(id){
  // Answers "what was classified as forensic vs. general, and how robustly":
  // the ensemble already votes per artifact (regex/keyword/NER/model) but
  // nothing surfaced that before — a category only one voter ever fires on
  // is a much weaker signal than one several voters agree on.
  const wrap=el('div',{class:'panel'});
  wrap.append(el('h2',{style:'margin-top:0'},'Classification breakdown'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'How the rules + keyword + NER + model ensemble voted per category. '+
      'Click a row for a few example artifacts and their individual votes.'));
  let d;
  try{ d=await api('/cases/'+id+'/classification'); }
  catch(e){ wrap.append(el('div',{class:'hint'},'Could not load: '+e.message)); return wrap; }

  const t=el('table',{},el('thead',{},el('tr',{},
    ...['Category','Count','Mean conf','Regex','Keyword','NER','Model'].map(h=>el('th',{},h)))));
  const tb=el('tbody',{});
  d.by_category.forEach(c=>{
    const exBox=el('div',{style:'display:none;padding:8px 0'});
    const row=el('tr',{style:'cursor:pointer',onclick:()=>{
      if(exBox.style.display==='none'){
        if(!exBox.childNodes.length){
          const examples=d.examples[c.category]||[];
          exBox.append(examples.length
            ? tbl(examples,['app','source_type','key','value','regex_vote','keyword_vote','ner_vote','model_vote'])
            : el('div',{class:'hint'},'no examples'));
        }
        exBox.style.display='block';
      } else exBox.style.display='none';
    }},
      el('td',{},el('span',{class:'pill cat'},c.category||'')),
      el('td',{},c.n.toLocaleString()),
      el('td',{},c.mean_conf??''),
      el('td',{},c.regex_agree.toLocaleString()),
      el('td',{},c.keyword_agree.toLocaleString()),
      el('td',{},c.ner_agree.toLocaleString()),
      el('td',{},c.model_agree.toLocaleString()));
    tb.append(row);
    const exRow=el('tr',{}); const exCell=el('td',{colspan:'7'},exBox);
    exRow.append(exCell); tb.append(exRow);
  });
  t.append(tb);
  wrap.append(el('div',{class:'scroll'},t));
  return wrap;
}

async function vReport(m){
  const id=state.arg;
  // Rendered as an iframe, not window.open(): a pywebview desktop window has
  // no browser chrome to open a new tab/window in, so window.open silently
  // did nothing there. An iframe works identically in the desktop app and a
  // plain browser tab, and keeps the report's own CSS isolated from the SPA's.
  m.innerHTML='';
  m.append(el('div',{class:'row',style:'margin-bottom:10px'},
    el('button',{class:'sec',onclick:()=>go('case',id)},'←  Back to case')));
  m.append(el('iframe',{
    src:'/api/cases/'+encodeURIComponent(id)+'/report',
    style:'width:100%;height:calc(100vh - 110px);border:1px solid var(--line);border-radius:8px;background:#fff'}));
}

function browser(id,cats,fixed){
  // `fixed` (from the case explorer's left nav) pins app and/or source_type
  // - which app/source to look at is chosen there, tree-style, rather than
  // from dropdowns here. With nothing fixed (unused currently, kept for
  // re-use) it falls back to picker dropdowns for both.
  fixed = fixed || {};
  const showUrl = fixed.source_type === 'cache';
  const wrap=el('div',{class:'panel'});
  const cat=el('select',{}, el('option',{value:''},'all categories'), ...cats.map(c=>el('option',{value:c},c)));
  const appSel = fixed.app ? null : el('select',{}, el('option',{value:''},'all apps'));
  const srcSel = fixed.source_type ? null : el('select',{}, el('option',{value:''},'all sources'));
  const q=el('input',{placeholder:'search key or value',style:'flex:1;min-width:180px'});
  const count=el('div',{class:'hint'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const prevBtn=el('button',{class:'sec'},'← Prev');
  const nextBtn=el('button',{class:'sec'},'Next →');
  const dlBtn=el('a',{class:'ghost',style:'text-decoration:none;padding:8px 8px;cursor:pointer'},'⬇ Download CSV');
  let facetsLoaded=false, offset=0; const limit=100;
  function currentParams(){
    const p=new URLSearchParams();
    if(cat.value)p.set('category',cat.value);
    if(fixed.app) p.set('app',fixed.app); else if(appSel.value) p.set('app',appSel.value);
    if(fixed.source_type) p.set('source_type',fixed.source_type); else if(srcSel.value) p.set('source_type',srcSel.value);
    if(q.value)p.set('q',q.value);
    return p;
  }
  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    const p=currentParams();
    p.set('limit',String(limit)); p.set('offset',String(offset));
    dlBtn.href='/api'+'/cases/'+id+'/artifacts/export.csv?'+currentParams();
    const d=await api('/cases/'+id+'/artifacts?'+p);
    if(!facetsLoaded && d.facets){
      if(appSel) d.facets.apps.forEach(a=>appSel.append(el('option',{value:a},a)));
      if(srcSel) d.facets.source_types.forEach(s=>srcSel.append(el('option',{value:s},s)));
      facetsLoaded=true;
    }
    count.textContent = d.total
      ? `showing ${offset+1}–${offset+d.shown} of ${d.total.toLocaleString()} matching`
      : 'no matching artifacts';
    prevBtn.disabled = offset<=0;
    nextBtn.disabled = offset+d.shown>=d.total;
    const cols=['Category','Conf'];
    if(!fixed.app) cols.push('App');
    if(!fixed.source_type) cols.push('Source');
    if(showUrl) cols.push('URL');
    cols.push('Time','Key','Value');
    const confTitle='Classification confidence (0–1) — how sure the rule/keyword/NER/model '+
      'ensemble was that this row belongs to its category. Higher is more certain.';
    const t=el('table',{},el('thead',{},el('tr',{},
      ...cols.map(h=>el('th',{title:h==='Conf'?confTitle:''},h)))));
    const tb=el('tbody',{});
    d.rows.forEach(r=>{
      const cells=[el('td',{},el('span',{class:'pill cat'},r.category||'')),
        el('td',{title:confTitle},r.confidence!=null?r.confidence.toFixed(2):'')];
      if(!fixed.app) cells.push(el('td',{},r.app));
      if(!fixed.source_type) cells.push(el('td',{},SRC_LABELS[r.source_type]||r.source_type));
      if(showUrl) cells.push(el('td',{class:'mono',title:r.url||'',
        style:'max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},r.url||''));
      cells.push(
        el('td',{title:r.record_ts||''},r.record_ts?ago(r.record_ts):''),
        el('td',{class:'mono'},r.key), el('td',{},r.value));
      // the physical evidence file this row came from, on hover - keeps the
      // table from needing its own column for it
      tb.append(el('tr',{title:r.source_file?'file: '+r.source_file:''},...cells));
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  cat.onchange=()=>{offset=0; load();};
  if(appSel) appSel.onchange=()=>{offset=0; load();};
  if(srcSel) srcSel.onchange=()=>{offset=0; load();};
  prevBtn.onclick=()=>{offset=Math.max(0,offset-limit); load();};
  nextBtn.onclick=()=>{offset+=limit; load();};
  let tmo; q.oninput=()=>{clearTimeout(tmo);tmo=setTimeout(()=>{offset=0; load();},300);};
  const heading = fixed.app
    ? fixed.source_type ? `${fixed.app} → ${SRC_LABELS[fixed.source_type]||fixed.source_type}` : `${fixed.app} → all sources`
    : 'Artifact browser';
  wrap.append(el('div',{class:'row'},
      el('h2',{style:'margin:0'},heading), el('span',{style:'flex:1'}), dlBtn),
    el('div',{class:'row',style:'margin-top:8px'},cat, ...(appSel?[appSel]:[]), ...(srcSel?[srcSel]:[]), q),
    count, out,
    el('div',{class:'row',style:'margin-top:8px'}, prevBtn, nextBtn));
  load();
  return wrap;
}

function fmtBytes(n){
  if(n==null) return '';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

function cacheFilesPanel(id, apps){
  // A ChromeCacheView-style inventory: one row per cache entry (the HTTP
  // disk cache and the Cache API alike), naming the exact physical file and
  // byte offset behind it - not just the logical cache key - so it's clear
  // which file on the evidence copy each row actually came from. Reads
  // straight off the evidence directory via /cache-files, independent of
  // whether analysis has run.
  const wrap=el('div',{class:'panel'});
  const appSel=el('select',{}, ...apps.map(a=>el('option',{value:a},a)));
  const q=el('input',{placeholder:'search URL or key',style:'flex:1;min-width:180px'});
  const count=el('div',{class:'hint'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const prevBtn=el('button',{class:'sec'},'← Prev');
  const nextBtn=el('button',{class:'sec'},'Next →');
  let offset=0; const limit=100; let total=0;

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    const p=new URLSearchParams({app:appSel.value, limit:String(limit), offset:String(offset)});
    if(q.value) p.set('q', q.value);
    let d;
    try{ d=await api('/cases/'+id+'/cache-files?'+p); }
    catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    total=d.total;
    count.textContent = total
      ? `showing ${offset+1}–${offset+d.shown} of ${total.toLocaleString()}`
      : 'no cache entries found for this app (the cache may be empty, or not part of this evidence copy)';
    prevBtn.disabled = offset<=0;
    nextBtn.disabled = offset+d.shown>=total;

    const t=el('table',{},el('thead',{},el('tr',{},
      ...['Filename','Kind','URL','Content Type','Size','Request Time','Status',''].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    d.rows.forEach(r=>{
      const title=[r.content_encoding?'encoding: '+r.content_encoding:'',
                   r.cache_control?'cache-control: '+r.cache_control:'',
                   r.server?'server: '+r.server:''].filter(Boolean).join(' · ');
      tb.append(el('tr',{title},
        el('td',{class:'mono'},r.physical_file||'—'),
        el('td',{},el('span',{class:'pill'},r.cache_kind==='cache_api'?'Cache API':'disk cache')),
        el('td',{class:'mono',style:'max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},r.url),
        el('td',{},r.content_type||''),
        el('td',{},fmtBytes(r.size_bytes)),
        el('td',{},r.request_time?ago(r.request_time):''),
        el('td',{},r.http_status||''),
        el('td',{}, r.openable
          ? el('button',{class:'ghost',onclick:()=>{
              state.cacheEntryTarget={caseId:id, app:r.app, dir:r.cache_dir, key:r.key, url:r.url};
              go('cacheentry');
            }},'Open')
          : '')));
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  appSel.onchange=()=>{offset=0; load();};
  prevBtn.onclick=()=>{offset=Math.max(0,offset-limit); load();};
  nextBtn.onclick=()=>{offset+=limit; load();};
  let tmo; q.oninput=()=>{clearTimeout(tmo); tmo=setTimeout(()=>{offset=0; load();},300);};
  wrap.append(el('h2',{style:'margin-top:0'},'Cache files'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Every entry in the HTTP disk cache and the Cache API, with the exact physical '+
      'file behind it - the same view a tool like ChromeCacheView gives, built on the '+
      'same evidence copy everything else here reads from.'),
    el('div',{class:'row'}, appSel, q), count, out,
    el('div',{class:'row',style:'margin-top:8px'}, prevBtn, nextBtn));
  load();
  return wrap;
}

function localStorageFilesPanel(id, apps){
  // The Local Storage equivalent of cacheFilesPanel - but a LevelDB key
  // isn't pinned to one physical file the way a cache entry is (compaction
  // moves it between .ldb files over time), so this lists the physical
  // store files themselves (name, kind, size, record count) rather than
  // one row per key. "Open" expands a raw record dump read directly from
  // that one file - real .ldb/.log parsing, not the merged logical view.
  const wrap=el('div',{class:'panel'});
  const appSel=el('select',{}, ...apps.map(a=>el('option',{value:a},a)));
  const out=el('div',{class:'scroll',style:'margin-top:10px'});

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    let d;
    try{ d=await api('/cases/'+id+'/localstorage-files?app='+encodeURIComponent(appSel.value)); }
    catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    if(!d.files.length){ out.innerHTML=''; out.append(el('div',{class:'hint'},'No Local Storage files found for this app.')); return; }
    const t=el('table',{},el('thead',{},el('tr',{},
      ...['Filename','Kind','Size','Records',''].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    d.files.forEach(f=>{
      const recBox=el('div',{style:'display:none;padding:8px 0'});
      let recOffset=0; const recLimit=100;
      async function loadRecords(){
        recBox.innerHTML='<div class="muted">loading…</div>';
        const rp=new URLSearchParams({app:appSel.value, file:f.filename, limit:String(recLimit), offset:String(recOffset)});
        const rd=await api('/cases/'+id+'/localstorage-files/open?'+rp);
        recBox.innerHTML='';
        recBox.append(el('div',{class:'hint'},
          `showing ${recOffset+1}–${recOffset+rd.shown} of ${rd.total.toLocaleString()} record(s) in ${f.filename}`+
          (rd.truncated?' — file ended early (a corrupt/partial record was hit)':'')));
        recBox.append(tbl(rd.records,['key','value','state','seq']));
        const nav=el('div',{class:'row',style:'margin-top:6px'});
        const pv=el('button',{class:'ghost',disabled:recOffset<=0,onclick:()=>{recOffset=Math.max(0,recOffset-recLimit);loadRecords();}},'← Prev');
        const nx=el('button',{class:'ghost',disabled:recOffset+rd.shown>=rd.total,onclick:()=>{recOffset+=recLimit;loadRecords();}},'Next →');
        nav.append(pv,nx); recBox.append(nav);
      }
      const row=el('tr',{style:'cursor:pointer',onclick:()=>{
        if(recBox.style.display==='none'){ recOffset=0; recBox.style.display='block'; loadRecords(); }
        else recBox.style.display='none';
      }},
        el('td',{class:'mono'},f.filename),
        el('td',{},f.kind),
        el('td',{},fmtBytes(f.size_bytes)),
        el('td',{},f.record_count!=null?f.record_count.toLocaleString()+(f.truncated?' (partial)':''):'—'),
        el('td',{},'Open'));
      tb.append(row);
      const recRow=el('tr',{}); recRow.append(el('td',{colspan:'5'},recBox)); tb.append(recRow);
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  appSel.onchange=load;
  wrap.append(el('h2',{style:'margin-top:0'},'Local Storage files'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Every physical .ldb/.log file in this app\'s Local Storage store, read directly - '+
      'raw records from that one file, including deleted/overwritten entries still '+
      'physically present, not the merged logical view the analysis pipeline uses.'),
    el('div',{class:'row'}, appSel), out);
  load();
  return wrap;
}

function databaseFilesPanel(id, apps){
  // Raw SQLite database browsing - currently the one database file the
  // evidence layout defines (Cookies), listed with its tables and row
  // counts; "Open" expands a paginated raw row dump for a chosen table.
  const wrap=el('div',{class:'panel'});
  const appSel=el('select',{}, ...apps.map(a=>el('option',{value:a},a)));
  const out=el('div',{class:'scroll',style:'margin-top:10px'});

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    let d;
    try{ d=await api('/cases/'+id+'/db-files?app='+encodeURIComponent(appSel.value)); }
    catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    if(!d.files.length){ out.innerHTML=''; out.append(el('div',{class:'hint'},'No database files found for this app.')); return; }
    const t=el('table',{},el('thead',{},el('tr',{},
      ...['File','Table','Rows',''].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    d.files.forEach(f=>f.tables.forEach(tbl_=>{
      const rowBox=el('div',{style:'display:none;padding:8px 0'});
      let rOffset=0; const rLimit=100;
      async function loadRows(){
        rowBox.innerHTML='<div class="muted">loading…</div>';
        const rp=new URLSearchParams({app:appSel.value, path:f.path, table:tbl_.table, limit:String(rLimit), offset:String(rOffset)});
        const rd=await api('/cases/'+id+'/db-files/open?'+rp);
        rowBox.innerHTML='';
        rowBox.append(el('div',{class:'hint'},
          `showing ${rOffset+1}–${rOffset+rd.rows.length} of ${rd.total.toLocaleString()} row(s)`));
        const rt=el('table',{},el('thead',{},el('tr',{},...rd.columns.map(c=>el('th',{},c)))));
        const rtb=el('tbody',{});
        rd.rows.forEach(row=>rtb.append(el('tr',{},...row.map(v=>el('td',{class:'mono'},v)))));
        rt.append(rtb); rowBox.append(rt);
        const nav=el('div',{class:'row',style:'margin-top:6px'});
        const pv=el('button',{class:'ghost',disabled:rOffset<=0,onclick:()=>{rOffset=Math.max(0,rOffset-rLimit);loadRows();}},'← Prev');
        const nx=el('button',{class:'ghost',disabled:rOffset+rd.rows.length>=rd.total,onclick:()=>{rOffset+=rLimit;loadRows();}},'Next →');
        nav.append(pv,nx); rowBox.append(nav);
      }
      const row=el('tr',{style:'cursor:pointer',onclick:()=>{
        if(rowBox.style.display==='none'){ rOffset=0; rowBox.style.display='block'; loadRows(); }
        else rowBox.style.display='none';
      }},
        el('td',{class:'mono'},f.filename), el('td',{},tbl_.table),
        el('td',{},tbl_.row_count.toLocaleString()), el('td',{},'Open'));
      tb.append(row);
      const dataRow=el('tr',{}); dataRow.append(el('td',{colspan:'4'},rowBox)); tb.append(dataRow);
    }));
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  appSel.onchange=load;
  wrap.append(el('h2',{style:'margin-top:0'},'Database files'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Raw SQLite tables from database-backed evidence files (Cookies today), read '+
      'directly - independent of what the named parser normally extracts from them.'),
    el('div',{class:'row'}, appSel), out);
  load();
  return wrap;
}

async function showAudit(id){
  document.getElementById('audit-section')?.remove();  // else a second click duplicates everything below
  const d=await api('/cases/'+id+'/audit');
  const sec=el('div',{id:'audit-section'});
  sec.append(
    el('h2',{},'Chain of custody'),
    el('div',{class:'panel scroll'}, tbl(d.custody,['seq','ts','event','actor','detail'])),
    el('h2',{},'Analysis audit'),
    el('div',{class:'panel scroll'}, tbl(d.audit,['seq','ts','kind','name','detail'])));
  $('#main').append(sec);
  window.scrollTo(0,document.body.scrollHeight);
}
function tbl(rows,cols){
  const t=el('table',{},el('thead',{},el('tr',{},...cols.map(c=>el('th',{},c)))));
  const tb=el('tbody',{});
  rows.forEach(r=>tb.append(el('tr',{},...cols.map(c=>
    el('td',{class:c==='detail'?'tbl-detail':'tbl-cell'},String(r[c]??''))))));
  t.append(tb); return t;
}

async function vSettings(m){
  const s=await api('/settings');
  m.innerHTML=''; m.append(el('h1',{},'Settings'));
  const box=el('div',{class:'panel'});
  const cr=el('input',{value:s.cases_root,style:'width:480px'});
  const prov=el('select',{}, ...['ollama','openai','anthropic'].map(p=>el('option',{value:p,...(p===s.llm.provider?{selected:''}:{})},p)));
  const mdl=el('input',{value:s.llm.model,style:'width:280px'});
  const url=el('input',{value:s.llm.base_url||'',placeholder:'http://localhost:11434/v1',style:'width:320px'});
  const key=el('input',{type:'password',placeholder:s.llm.api_key_set?'•••••• (set)':'API key',style:'width:280px'});
  const ag=el('input',{type:'checkbox',...(s.use_agent?{checked:''}:{})});
  const zs=el('input',{type:'checkbox',...(s.use_zeroshot?{checked:''}:{})});
  const md=el('input',{value:s.classifier_model_dir||'',placeholder:'(none — rules only)',style:'width:360px'});
  box.append(
    el('label',{},'Cases directory'), cr,
    el('label',{},'LLM provider'), prov,
    el('label',{},'Model'), mdl,
    el('label',{},'Base URL (Ollama / OpenAI-compatible)'), url,
    el('label',{},'API key (OpenAI / Anthropic / Google)'), key,
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:12px'}, ag, 'Use the AI agent to orchestrate analysis (otherwise a fixed deterministic pipeline runs)'),
    el('div',{class:'muted',style:'margin-top:6px'},'Model selection only — installing a local model runtime or provisioning an API key is a separate, one-time setup step.'),
    el('label',{},'Trained classifier model directory (optional)'), md,
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:10px'}, zs, 'Use the pretrained zero-shot classifier as an additional voter'),
    el('div',{class:'muted',style:'margin-top:6px'},'Classification runs on the built-in rule ensemble by default. Point this at a trained model to improve accuracy further.'));
  m.append(box);

  const jbox=el('div',{class:'panel'});
  const juse=el('input',{type:'checkbox',...(s.use_judge?{checked:''}:{})});
  const jprov=el('select',{}, ...['ollama','openai','anthropic'].map(p=>el('option',{value:p,...(p===s.judge_llm.provider?{selected:''}:{})},p)));
  const jmdl=el('input',{value:s.judge_llm.model,style:'width:280px'});
  const jurl=el('input',{value:s.judge_llm.base_url||'',placeholder:'leave blank to inherit',style:'width:320px'});
  const jkey=el('input',{type:'password',placeholder:s.judge_llm.api_key_set?'•••••• (set)':'leave blank to inherit',style:'width:280px'});
  jbox.append(
    el('h2',{style:'margin-top:0'},'Independent Review'),
    el('div',{class:'hint',style:'margin-bottom:10px'},
      'A second model reviews every finding the primary agent writes before it reaches the '+
      'report — accepting, flagging, or rejecting each one with its reasoning. Leaving these '+
      'fields blank points it at the same provider and model as the agent above; for a '+
      'genuinely independent check, configure a different one here.'),
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg)'}, juse, 'Enable independent review'),
    el('label',{style:'margin-top:10px'},'Provider'), jprov,
    el('label',{},'Model'), jmdl,
    el('label',{},'Base URL'), jurl,
    el('label',{},'API key'), jkey);
  m.append(jbox);

  const actions=el('div',{class:'panel'});
  actions.append(el('div',{class:'row'},
      el('button',{onclick:async(e)=>{
        const btn=e.target;
        btn.disabled=true; btn.innerHTML='<span class="spin"></span>Saving…';
        try{
          const body={cases_root:cr.value,llm_provider:prov.value,llm_model:mdl.value,llm_base_url:url.value,
            use_agent:ag.checked,use_zeroshot:zs.checked,classifier_model_dir:md.value,
            use_judge:juse.checked,judge_llm_provider:jprov.value,judge_llm_model:jmdl.value,judge_llm_base_url:jurl.value};
          if(key.value)body.llm_api_key=key.value;
          if(jkey.value)body.judge_llm_api_key=jkey.value;
          await api('/settings',{method:'PUT',body:JSON.stringify(body)});
          btn.textContent='Saved ✓';
          setTimeout(()=>{btn.textContent='Save Settings';btn.disabled=false;},1500);
        }catch(x){ alert('Could not save settings: '+x.message); btn.textContent='Save Settings'; btn.disabled=false; }
      }},'Save Settings'),
      el('button',{class:'sec',onclick:async(e)=>{
        e.target.disabled=true; e.target.textContent='Testing…';
        try{ const r=await api('/settings/test-llm',{method:'POST'});
          alert(r.ok?`OK — ${r.provider}/${r.model}\n${r.sample||''}`:`Failed: ${r.error}`);
        }catch(x){alert('Error: '+x.message);}
        e.target.disabled=false; e.target.textContent='Test connection';
      }},'Test connection'),
      el('button',{class:'sec',onclick:async(e)=>{
        e.target.disabled=true; e.target.textContent='Testing…';
        try{ const r=await api('/settings/test-judge-llm',{method:'POST'});
          alert(r.ok?`OK — ${r.provider}/${r.model}\n${r.sample||''}`:`Failed: ${r.error}`);
        }catch(x){alert('Error: '+x.message);}
        e.target.disabled=false; e.target.textContent='Test judge connection';
      }},'Test judge connection')));
  m.append(actions);
}

  try{ const h=await api('/settings'); $('#conn').textContent='● connected'; }

  const [v,a]=location.hash.slice(1).split('/'); state.view=v||'dashboard'; state.arg=a||null;

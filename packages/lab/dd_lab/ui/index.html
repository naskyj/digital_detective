function processesPanel(id, app){
  // memory_process rows are flat, one row per Volatility column (pslist AND
  // cmdline share this source_type - both keyed "mem.process.*"/"mem.cmdline.*")
  // - pivot them into one row per process, by PID, before rendering. Unlike
  // the disk Files panels this reads the warehouse (via the normal artifacts
  // endpoint), not a re-opened physical file: a process's own memory was
  // extracted, carved, and deleted during analysis (dd_lab/memory/analyze.py),
  // there's nothing left on disk to re-read.
  const wrap=el('div',{class:'panel'});
  const out=el('div',{class:'scroll',style:'margin-top:10px'});
  const hint=el('div',{class:'hint',style:'margin-bottom:8px'});

  function pivotByPid(rows){
    const locatorPid=new Map();
    rows.forEach(r=>{ if(r.key.endsWith('.PID')) locatorPid.set(r.source_locator, r.value); });
    const byPid=new Map();
    rows.forEach(r=>{
      const pid=locatorPid.get(r.source_locator);
      if(pid==null) return;  // a stray column with no PID sibling in its own row
      const col=r.key.slice(r.key.lastIndexOf('.')+1);
      if(!byPid.has(pid)) byPid.set(pid, {pid});
      byPid.get(pid)[col]=r.value;
    });
    return [...byPid.values()].sort((a,b)=>Number(a.pid)-Number(b.pid));
  }

  async function load(){
    out.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    // the normal /artifacts endpoint strips source_locator (an internal
    // encoding no other UI column needs) before returning rows, but this
    // panel's whole pivot-by-PID trick depends on it - so this reads the
    // warehouse's own read-only query endpoint directly instead, with an
    // explicit LIMIT (the endpoint auto-appends its own 200-row cap unless
    // the SQL already has one).
    const sql = `SELECT key, value, source_locator FROM artifacts WHERE app = ${sqlQuote(app)} `+
      `AND source_type = 'memory_process' LIMIT 5000`;
    let d;
    try{
      d=await api('/cases/'+id+'/query',{method:'POST',body:JSON.stringify({sql})});
      if(!d.ok) throw new Error(d.error||'query failed');
    }catch(e){ out.innerHTML=''; out.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    const procs=pivotByPid(d.rows);
    if(!procs.length){
      out.innerHTML='';
      out.append(el('div',{class:'hint'},
        'No process records for this app - Volatility may not have run (needs the `vol` '+
        'CLI on the analysis machine and a full RAM image), or nothing matched this app.'));
      return;
    }
    hint.textContent=`${procs.length.toLocaleString()} process(es) from this app's memory analysis`;
    const t=el('table',{style:'table-layout:fixed;width:100%'},el('thead',{},el('tr',{},
      ...['PID','Image name','PPID','Created',''].map(h=>el('th',{},h)))));
    const tb=el('tbody',{});
    procs.forEach(p=>{
      tb.append(el('tr',{style:'cursor:pointer',title:'Click to view this process\'s details and carved memory strings',
        onclick:()=>{ state.processTarget={caseId:id, app, proc:p}; go('processdetail'); }},
        el('td',{class:'mono'},p.pid),
        el('td',{style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},p.ImageFileName||''),
        el('td',{class:'mono'},p.PPID||''),
        el('td',{},p.CreateTime||''),
        el('td',{},el('button',{class:'ghost'},'View →'))));
    });
    t.append(tb); out.innerHTML=''; out.append(t);
  }
  wrap.append(el('h2',{style:'margin-top:0'},app+' → Memory Processes → Files'),
    el('div',{class:'hint',style:'margin-bottom:8px'},
      'Every process Volatility found belonging to this app (root matches plus every '+
      'spawned descendant) - click one to see its full details and the memory strings '+
      'carved from its own memory specifically, not the whole image.'),
    hint, out);
  load();
  return wrap;
}

async function vProcessDetail(m){
  const t=state.processTarget;
  m.innerHTML='';
  if(!t){
    m.append(el('div',{class:'panel'},'Nothing selected — go back to the case and open a process.'),
      el('button',{class:'sec',onclick:()=>go('cases')},'← Back to Cases'));
    return;
  }
  const p=t.proc;
  m.append(el('div',{class:'row',style:'margin-bottom:10px'},
    el('button',{class:'sec',onclick:()=>go('case',t.caseId)},'←  Back to case')));
  m.append(el('h1',{},p.ImageFileName||('PID '+p.pid)),
    el('div',{class:'muted mono',style:'margin-bottom:14px'},t.app+' · PID '+p.pid));

  const DETAIL_COLS=[['pid','PID'],['PPID','Parent PID'],['ImageFileName','Image name'],
    ['CreateTime','Created'],['ExitTime','Exited'],['Threads','Threads'],['Handles','Handles'],
    ['SessionId','Session'],['Wow64','WoW64'],['Offset(V)','Offset (V)'],
    ['Process','Command line: process'],['Args','Command line: args']];
  const dl=el('div',{class:'panel',style:'margin-bottom:16px'});
  DETAIL_COLS.forEach(([k,label])=>{
    if(p[k]==null || p[k]==='') return;
    dl.append(el('div',{class:'row',style:'padding:4px 0;border-bottom:1px solid var(--line)'},
      el('div',{class:'muted',style:'width:170px;flex-shrink:0'},label),
      el('div',{class:'mono',style:'word-break:break-all'},String(p[k]))));
  });
  m.append(dl);

  m.append(el('h2',{},'Strings carved from this process’s memory'));
  m.append(browser(t.caseId, [], {app:t.app, source_type:'memory_string', q:'pid'+p.pid+':'}));
}

async function vChat(m){
  // Phase 6 of the agent-improvement plan (magical-dazzling-dragon.md), the
  // last phase - its own page (same reasoning as Report/Audit: this used to
  // have no precedent at all in this codebase, so it gets a focused view
  // rather than being squeezed into the case page). Read-mostly: the chat
  // agent (dd_lab/agent/chat.py) can search/correlate/look at process
  // memory but never writes findings or runs new analysis - only "Run
  // analysis" does that, unconditionally, before any agent starts.
  const id=state.arg;
  m.innerHTML='';
  m.append(el('div',{class:'row',style:'margin-bottom:10px'},
    el('button',{class:'sec',onclick:()=>go('case',id)},'←  Back to case')));
  m.append(el('h1',{},'Chat'), el('div',{class:'muted mono',style:'margin-bottom:6px'},id));
  m.append(el('div',{class:'hint',style:'margin-bottom:10px'},
    "Ask about what's already in this case's warehouse - it can search, correlate identifiers "+
    "across apps, and look at a specific process's memory, but it never writes findings or "+
    "changes the case; those only ever happen through Run analysis."));

  const thread=el('div',{class:'panel',
    style:'max-height:calc(100vh - 330px);overflow:auto;display:flex;flex-direction:column;gap:10px'});
  const input=el('textarea',{placeholder:'Ask a question about this case… (Enter to send, Shift+Enter for a new line)'});
  const sendBtn=el('button',{},'Send');
  const err=el('div',{class:'hint',style:'color:var(--bad)'});

  function bubble(role,text){
    const isUser = role==='user';
    const box=el('div',{style:
      'align-self:'+(isUser?'flex-end':'flex-start')+';max-width:78%;'+
      'background:'+(isUser?'var(--accent2)':'var(--bg)')+';color:'+(isUser?'#fff':'var(--fg)')+';'+
      'border:1px solid var(--line);border-radius:10px;padding:8px 12px;'+
      'white-space:pre-wrap;word-break:break-word;font-size:13.5px'},
      text);
    if(!isUser) box.append(saveAsFindingRow(text));
    return box;
  }

  // Investigator-triggered save (Phase C, magical-dazzling-dragon.md) - the
  // chat LLM itself can never write a finding (chat.py's toolset excludes
  // write_finding entirely); this is the human's own explicit action,
  // going through the exact same citation-verification write_finding
  // always uses. The reply's own tool calls aren't surfaced to the UI
  // (history_for_ui flattens them away), so the investigator pastes the
  // artifact_id(s) themselves - a wrong one just fails verification
  // safely, never silently accepted.
  function saveAsFindingRow(replyText){
    const toggle=el('a',{style:'display:block;margin-top:6px;font-size:12px;cursor:pointer;opacity:.75'},'💾 Save as finding');
    const form=el('div',{hidden:true,style:'margin-top:8px;padding-top:8px;border-top:1px solid var(--line)'});
    const wrap=el('div',{},toggle,form);

    function buildForm(){
      const claim=el('textarea',{style:'width:100%;min-height:50px;font-size:13px'},replyText);
      const citeWrap=el('div',{});
      const status=el('div',{class:'hint',style:'margin-top:6px'});
      function citeRow(){
        return el('div',{class:'row',style:'margin-top:4px;gap:6px'},
          el('input',{placeholder:'artifact_id',class:'mono',style:'flex:1'}),
          el('input',{placeholder:'exact quote (optional)',style:'flex:1'}));
      }
      citeWrap.append(citeRow());
      const addCite=el('a',{style:'font-size:12px;cursor:pointer;opacity:.75;display:inline-block;margin-top:4px'},
        '+ add another citation');
      addCite.onclick=()=>citeWrap.append(citeRow());
      const saveBtn=el('button',{class:'sec'},'Save');
      saveBtn.onclick=async()=>{
        const citations=[...citeWrap.children].map(r=>{
          const [aid,quote]=r.querySelectorAll('input');
          return {artifact_id: aid.value.trim(), quote: quote.value.trim()||undefined};
        }).filter(c=>c.artifact_id);
        if(!citations.length){ status.textContent='At least one artifact_id is required.'; return; }
        saveBtn.disabled=true; status.textContent='Saving…';
        try{
          const r=await api('/cases/'+id+'/findings',{method:'POST',
            body:JSON.stringify({claim: claim.value, citations})});
          status.innerHTML='';
          status.append(r.ok
            ? el('span',{class:'pill ok'},'✓ verified — saved to findings')
            : el('span',{class:'pill bad'},'✗ rejected — '+(r.unverified_citations||[]).join(', ')+' failed verification'));
        }catch(e){ status.textContent='Could not save: '+e.message; }
        finally{ saveBtn.disabled=false; }
      };
      form.append(claim, citeWrap, addCite, el('div',{}, saveBtn), status);
    }

    toggle.onclick=()=>{
      if(form.hidden && !form.childNodes.length) buildForm();
      form.hidden=!form.hidden;
    };
    return wrap;
  }

  async function loadHistory(){
    thread.innerHTML='<div class="muted" style="padding:10px">loading…</div>';
    let d;
    try{ d=await api('/cases/'+id+'/chat'); }
    catch(e){ thread.innerHTML=''; thread.append(el('div',{class:'hint'},'Could not load: '+e.message)); return; }
    thread.innerHTML='';
    if(!d.turns.length){
      thread.append(el('div',{class:'hint'},'No messages yet — ask something below.'));
      return;
    }
    d.turns.forEach(t=>thread.append(bubble(t.role,t.text)));
    thread.scrollTop=thread.scrollHeight;
  }

  async function send(){
    const text=input.value.trim();
    if(!text) return;
    err.textContent='';
    input.value=''; input.disabled=true; sendBtn.disabled=true;
    sendBtn.innerHTML='<span class="spin" style="border-color:#0003;border-top-color:#333"></span>…';
    if(thread.querySelector('.hint')) thread.innerHTML='';  // clear the "no messages yet" hint
    thread.append(bubble('user',text));
    thread.scrollTop=thread.scrollHeight;
    try{
      const d=await api('/cases/'+id+'/chat',{method:'POST',body:JSON.stringify({message:text})});
      if(!d.ok) throw new Error(d.error||'chat failed');
      thread.append(bubble('assistant',d.reply));
      thread.scrollTop=thread.scrollHeight;
    }catch(e){
      err.textContent='Could not get a reply: '+e.message;
    }finally{
      input.disabled=false; sendBtn.disabled=false; sendBtn.textContent='Send'; input.focus();
    }
  }
  sendBtn.onclick=send;
  input.onkeydown=e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } };

  m.append(thread,
    el('div',{class:'row',style:'margin-top:10px;align-items:flex-start'}, input, sendBtn),
    err);
  loadHistory();
  input.focus();
}

function tbl(rows,cols){
  const t=el('table',{},el('thead',{},el('tr',{},...cols.map(c=>el('th',{},c)))));
  const tb=el('tbody',{});
  rows.forEach(r=>tb.append(el('tr',{},...cols.map(c=>
    el('td',{class:c==='detail'?'tbl-detail':'tbl-cell'},String(r[c]??''))))));
  t.append(tb); return t;
}

  const key=el('input',{type:'password',placeholder:s.llm.api_key_set?'•••••• (set)':'API key',style:'width:280px'});

  const zs=el('input',{type:'checkbox',...(s.use_zeroshot?{checked:''}:{})});
  const md=el('input',{value:s.classifier_model_dir||'',placeholder:'(none — rules only)',style:'width:360px'});
  const rmd=el('input',{value:s.relevance_model_dir||'',placeholder:'(none — rules only)',style:'width:360px'});
  box.append(
    el('label',{},'Cases directory'), cr,
    el('label',{},'LLM provider'), prov,
    el('label',{},'Model'), mdl,
    el('label',{},'Base URL (Ollama / OpenAI-compatible)'), url,
    el('label',{},'API key (OpenAI / Anthropic / Google)'), key,
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:12px'}, ag, 'Use the AI agent to orchestrate analysis (otherwise a fixed deterministic pipeline runs)'),
    el('div',{class:'muted',style:'margin-top:6px'},'Model selection only — installing a local model runtime or provisioning an API key is a separate, one-time setup step.'),
    el('label',{},'Trained category model directory (optional)'), md,
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg);margin-top:10px'}, zs, 'Use the pretrained zero-shot classifier as an additional voter'),
    el('div',{class:'muted',style:'margin-top:6px'},'Classification runs on the built-in rule ensemble by default. Point this at a trained model to improve category accuracy further.'),
    el('label',{style:'margin-top:12px'},'Trained relevance model directory (optional)'), rmd,
    el('div',{class:'muted',style:'margin-top:6px'},
      'A DIFFERENT model from the one above - predicts relevant/not_relevant directly rather than '+
      'a category, feeding the primary relevant/relevance_score output. Point this at a trained '+
      'binary relevant/not_relevant ONNX model directory (model.onnx, tokenizer.json, labels.json) '+
      'to improve relevance beyond the rule-based voters alone.'));
  m.append(box);

  const jbox=el('div',{class:'panel'});
  const juse=el('input',{type:'checkbox',...(s.use_judge?{checked:''}:{})});
  const jprov=el('select',{}, ...['ollama','openai','anthropic'].map(p=>el('option',{value:p,...(p===s.judge_llm.provider?{selected:''}:{})},p)));
  const jmdl=el('input',{value:s.judge_llm.model,style:'width:280px'});
  const jurl=el('input',{value:s.judge_llm.base_url||'',placeholder:'leave blank to inherit',style:'width:320px'});
  const jkey=el('input',{type:'password',placeholder:s.judge_llm.api_key_set?'•••••• (set)':'leave blank to inherit',style:'width:280px'});
  jbox.append(
    el('h2',{style:'margin-top:0'},'Independent Review'),
    el('div',{class:'hint',style:'margin-bottom:10px'},
      'A second model reviews every finding the primary agent writes before it reaches the '+
      'report — accepting, flagging, or rejecting each one with its reasoning. Leaving these '+
      'fields blank points it at the same provider and model as the agent above; for a '+
      'genuinely independent check, configure a different one here.'),
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--fg)'}, juse, 'Enable independent review'),
    el('label',{style:'margin-top:10px'},'Provider'), jprov,
    el('label',{},'Model'), jmdl,
    el('label',{},'Base URL'), jurl,
    el('label',{},'API key'), jkey);
  m.append(jbox);

  const actions=el('div',{class:'panel'});
  actions.append(el('div',{class:'row'},
      el('button',{onclick:async(e)=>{
        const btn=e.target;
        btn.disabled=true; btn.innerHTML='<span class="spin"></span>Saving…';
        try{
          const body={cases_root:cr.value,llm_provider:prov.value,llm_model:mdl.value,llm_base_url:url.value,

        try{ const r=await api('/settings/test-judge-llm',{method:'POST'});
          alert(r.ok?`OK — ${r.provider}/${r.model}\n${r.sample||''}`:`Failed: ${r.error}`);
        }catch(x){alert('Error: '+x.message);}
        e.target.disabled=false; e.target.textContent='Test judge connection';
      }},'Test judge connection')));
  m.append(actions);
}

[project]
name = "dd-core"
version = "0.1.0"
description = "Shared core: artifact schema, hashing, manifest, chain-of-custody, signing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "cryptography>=43.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dd_core"]
